<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Supercomputer · ventilador</title>
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
  #lienzo { position: absolute; inset: 0; overflow: hidden; }
  #lienzo > video, #lienzo > img { position: absolute; display: none; }
  #lienzo > .on { display: block; }
  /* Identificar: número grande del ventilador, su puerto y su posición en la cadena. */
  #numero { position: absolute; inset: 0; display: none; place-items: center; text-align: center;
    font: 800 210px/1 system-ui, sans-serif; color: #04101f; }
  #numero small { display: block; font: 700 30px/1.2 ui-monospace, Menlo, monospace; margin-top: 6px; }
  /* Inquilinos (PortAventuraNeXT): la figura LEGO en su ventilador, o el ventilador vacío. */
  #casa { position: absolute; inset: 0; display: none; background: radial-gradient(circle at 50% 44%, #2a0a0d 0%, #120507 58%, #050505 74%); }
  #casa img { position: absolute; left: 50%; top: 47%; height: 72%; transform: translate(-50%, -50%); filter: drop-shadow(0 8px 14px rgba(0,0,0,.75)); }
  #casa b { position: absolute; left: 0; right: 0; bottom: 13%; text-align: center; color: #F6F1EA; font: 700 22px/1 ui-monospace, Menlo, monospace; letter-spacing: .14em; text-transform: uppercase; }
  #casa.vacio { background: #000; }
  #casa.vacio::after { content: ''; position: absolute; inset: 16%; border-radius: 50%; border: 3px dashed rgba(246,241,234,.35); }
  #casa.vacio:not(.arte) img, #casa.vacio b { display: none; }
  #casa.arte { background: #000; }
  #casa.arte::after { content: none; }
  #casa.arte img { left: 0; top: 0; width: 100%; height: 100%; transform: none; filter: none; }
  /* Un píxel casi negro que cambia cada fotograma: el screencast de Chrome sin ventana solo manda fotogramas
     cuando algo se repinta, y tras un cambio fijo (sale la figura) la pantalla se quedaba con el anterior ~4 s. */
  #pulso { position: absolute; left: 0; top: 0; width: 2px; height: 2px; background: #000; }
</style>
</head>
<body>
<div id="lienzo"></div>
<div id="numero"></div>
<div id="casa"><img alt=""><b></b><i id="pulso"></i></div>
<script type="module">
// Render de un ventilador en los modos extender, sincro y secuencia. Lo abre el puente en Chrome sin
// ventana (un Chrome por ventilador) y captura su screencast. Todos los ventiladores usan el
// mismo reloj (Date.now() del PC): así las teselas y el relevo van alineados.
// En secuencia cada página precarga la pieza oculta, mide su duración y se la pasa al puente
// (POST /duracion), que la usa para el relevo de la luz.
// Audio (?audio=1&volumen=0–1): esta página suena; el resto, en silencio.
import { asignacion, turnoSecuencia } from '/escena.mjs';

const qs = new URLSearchParams(location.search);
const fan = Number(qs.get('fan')) || 1;
// Audio: solo la página del ventilador que suena trae ?audio=1 (su Chrome va sin --mute-audio). Suena la primera
// pieza, que en extender y secuencia es la única; las demás páginas siguen calladas.
const conAudio = qs.get('audio') === '1', volumen = Math.max(0, Math.min(1, Number(qs.get('volumen') ?? 1) || 0));
const lienzo = document.getElementById('lienzo');
const ajusteCss = { cubrir: 'cover', estirar: 'fill', contener: 'contain' };
let pulsos = 0;
let estado = null;                 // { escena, medios: { id: { url, tipo } } }
const elementos = new Map();       // id de pieza → <video>/<img>

function elemento(id) {
  if (elementos.has(id)) return elementos.get(id);
  const medio = estado.medios[id];
  if (!medio) return null;
  const el = document.createElement(medio.tipo === 'image' ? 'img' : 'video');
  if (el.tagName === 'VIDEO') {
    el.muted = !(conAudio && id === estado.escena.piezas[0]); el.volume = volumen;
    el.loop = true; el.playsInline = true; el.preload = 'auto'; el.autoplay = true;
  }
  el.src = medio.url;
  lienzo.appendChild(el);
  elementos.set(id, el);
  return el;
}

// Corrige la deriva respecto al reloj común: salto si va muy desfasado, ajuste fino si no.
function alinear(video, t) {
  if (!(video.duration > 0)) return;
  const objetivo = t % video.duration;
  let d = objetivo - video.currentTime;
  if (d > video.duration / 2) d -= video.duration; else if (d < -video.duration / 2) d += video.duration;
  if (Math.abs(d) > 0.5) { video.currentTime = objetivo; video.playbackRate = 1; }
  else video.playbackRate = 1 + Math.max(-0.08, Math.min(0.08, d * 0.6));
  if (video.paused) video.play().catch(() => {});
}

const informadas = new Set();
function informarDuracion(pieza, s) {
  if (informadas.has(pieza) || Math.abs((estado.escena.duracion || 0) - s) <= 0.05) return;
  informadas.add(pieza);
  fetch('/duracion', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ pieza, s }) })
    .catch(() => informadas.delete(pieza));
}

function pintar() {
  requestAnimationFrame(pintar);
  if (!estado) return;
  let escena = estado.escena;
  if (escena.modo === 'secuencia' && escena.piezas[0]) {
    const el = elemento(escena.piezas[0]);   // oculta y en marcha: al llegar su turno ya va por el segundo justo
    if (el?.tagName === 'VIDEO' && el.duration > 0) {
      if (!(escena.duracion > 0)) escena = { ...escena, duracion: el.duration };
      informarDuracion(escena.piezas[0], el.duration);
    }
  }
  const a = asignacion(escena, fan, Date.now());
  const numero = document.getElementById('numero');
  if (a.tipo === 'numero') {
    const f = (estado.fans || []).find(x => x.n === fan) || {};
    numero.style.display = 'grid';
    numero.style.background = `hsl(${(fan - 1) * 51} 85% 60%)`;
    numero.innerHTML = `<div>${fan}<small>${f.port != null ? `puerto ${f.port} · pos ${f.index}` : ''}</small></div>`;
    return;
  }
  numero.style.display = 'none';
  const casa = document.getElementById('casa');
  if (a.tipo === 'inquilino' || a.tipo === 'vacio') {
    for (const el of elementos.values()) { el.classList.remove('on'); if (el.tagName === 'VIDEO' && !el.paused) el.pause(); }
    document.getElementById('creel')?.classList.remove('vis', 'activo', 'reposo', 'on');   // capa Creel del relevo, fuera
    casa.style.display = 'block';
    document.getElementById('pulso').style.background = (pulsos = (pulsos + 1) % 2) ? '#010101' : '#000';
    casa.classList.toggle('vacio', a.tipo === 'vacio');
    // Arte de ventilador ya hecho para la Creel House (CREEL_IMGS: un 400×400 por personaje y el «vacío»), si esta
    // página lo trae; si no, la figura que subió el player del show (POST /pan/figura) con su nombre debajo.
    const arte = typeof CREEL_IMGS !== 'undefined' ? CREEL_IMGS : null;
    const clave = a.tipo === 'inquilino' ? a.figura : 'vacio';
    const src = (arte && arte[clave]) || (a.tipo === 'inquilino' ? (estado.figuras || {})[a.figura] : null);
    casa.classList.toggle('arte', !!(arte && arte[clave]));
    const img = casa.querySelector('img');
    if (src && img.dataset.f !== clave) { img.dataset.f = clave; img.src = src; }
    casa.querySelector('b').textContent = a.tipo === 'inquilino' && !(arte && arte[clave]) ? (a.nombre || '') : '';
    return;
  }
  casa.style.display = 'none';
  const visible = a.tipo === 'negro' || a.tipo === 'canal' ? null : elemento(a.pieza);
  // Secuencia: el activo (y la página que suena) siguen el turno en curso; los que esperan dejan la pieza parada al
  // principio, lista para su turno (con «cada x s» el turno la empieza desde el principio).
  const turno = escena.modo === 'secuencia' ? turnoSecuencia(escena, (Date.now() - escena.epoch) / 1000) : null;
  for (const [id, el] of elementos) {
    const on = el === visible;
    el.classList.toggle('on', on);
    if (turno && el.tagName === 'VIDEO' && id === escena.piezas[0]) {
      if (on || conAudio) alinear(el, turno.t);
      else { if (!el.paused) el.pause(); if (el.currentTime > 0.05) el.currentTime = 0; }
      continue;
    }
    // En sincro todas las piezas siguen corriendo ocultas: al llegar a este ventilador ya van por su segundo.
    if (el.tagName === 'VIDEO' && estado.escena.piezas.includes(id)) alinear(el, a.t ?? (Date.now() - estado.escena.epoch) / 1000);
  }
  if (!visible) return;
  const s = visible.style;
  if (a.tipo === 'tesela') {
    s.width = a.columnas * 100 + '%'; s.height = a.filas * 100 + '%';
    s.left = -a.col * 100 + '%'; s.top = -a.fila * 100 + '%';
    s.objectFit = ajusteCss[a.ajuste] || 'cover';
  } else {
    s.width = '100%'; s.height = '100%'; s.left = '0'; s.top = '0'; s.objectFit = 'cover';
  }
}

async function sondear() {
  try {
    const r = await fetch('/escena.json', { cache: 'no-store' });
    if (r.ok) {
      estado = await r.json();
      for (const [id, el] of elementos) if (!estado.escena.piezas.includes(id)) { el.remove(); elementos.delete(id); }
    }
  } catch {}
  setTimeout(sondear, 1000);
}
sondear();
requestAnimationFrame(pintar);
</script>
</body>
</html>
