<body>
<div id="box"><canvas id="led" width="1440" height="540"></canvas></div>
<script>
(function () {
  "use strict";
  var W = 1440, H = 540;
  var canvas = document.getElementById("led");
  var g = canvas.getContext("2d");
  var caja = document.getElementById("box");
  // Pantalla llena (Carlos, 15-nov-2026): la TCL de la cocina hace de pantalla gigante de LEDs real y no quiere franjas
  // negras. Si el visor no es apaisado tipo 8:3 (p. ej. 16:9), la pared se compone para TODO el visor: mismo ancho
  // lógico (1440) y el alto que pida la proporción, con su propia maqueta vertical y a la resolución real (4K nítido).
  // ?formato=83 fuerza la pared 8:3 de siempre; ?formato=169 fuerza 16:9. En 8:3 todo sigue exactamente igual.
  var lleno = false, escala = 1, L = null;
  function maqueta() {
    var u = H / 810;
    return { luzY: 38 * u, luzR: 16, luzF: 17, tituloY: 168 * u, tituloF: 136, hawY: 272 * u, hawF: 32,
      hudY: 340 * u, hudF: 56, subF: 22, subDy: 72, retY: 320 * u, retH: 400 * u, nomF: 60, texF: 32, texDy: 58,
      msgY: H - 70 * u, msgF: 50, pieF: 20 };
  }
  function ajusta() {
    var fm = String(location.search || "").match(/[?&]formato=([a-z0-9]+)/i), fmt = fm ? fm[1].toLowerCase() : "";
    var vw = window.innerWidth || W, vh = window.innerHeight || H, a = vw / vh;
    lleno = fmt === "169" || fmt === "lleno" || (fmt !== "83" && a < 2.2);
    if (!lleno) {
      if (H !== 540 || escala !== 1 || caja.style.width) { H = 540; escala = 1; L = null; caja.removeAttribute("style"); canvas.width = W; canvas.height = H; }
      return;
    }
    var asp = fmt === "169" ? 16 / 9 : Math.max(1, a);
    var cw = Math.min(vw, vh * asp), ch = cw / asp;
    H = Math.round(W / asp); L = maqueta();
    caja.style.cssText = "left:" + ((vw - cw) / 2) + "px;top:" + ((vh - ch) / 2) + "px;width:" + cw + "px;height:" + ch + "px;max-width:none;max-height:none;transform:none";
    var dpr = window.devicePixelRatio || 1, bw = Math.max(1, Math.round(cw * dpr)), bh = Math.max(1, Math.round(ch * dpr));
    escala = bw / W;
    if (canvas.width !== bw || canvas.height !== bh) { canvas.width = bw; canvas.height = bh; }
  }
  ajusta();
  window.addEventListener("resize", ajusta);
  var clima = { tipo: "sol", temp: null, ok: false, forzado: null, real: null };
  var ICONO = { sol: "\u2600\uFE0F", nubes: "\u2601\uFE0F", lluvia: "\uD83C\uDF27\uFE0F", tormenta: "\u26C8\uFE0F" };
  var NOMBRE = { sol: "Sol", nubes: "Nubes", lluvia: "Lluvia", tormenta: "Tormenta" };
  var colores = ["#ff4a3d", "#ffd23f", "#3fd2ff", "#5dff8a", "#ff6ad5"];
  var esporas = [];
  var gotas = [];
  var i;
  // Diagnóstico remoto (15-nov-2026): la TCL no se mira de cerca; los errores JS (fotograma, promesa sin catch, WebView viejo) se cuentan
  // y el latido lleva cuántos, el último (120 caracteres) y los minutos encendida, para ver desde /signage/now si falla sin ir a la tele.
  var diag = { errores: 0, ultimo: "" };
  function anota(e) {
    diag.errores++;
    try { var m = e && typeof e === "object" ? (e.message || (e.reason && e.reason.message) || e.reason || e.type || "") : e; diag.ultimo = String(m || "error").slice(0, 120); } catch (x) {}
  }
  // Fotogramas por segundo (15-nov-2026): si el WebView de la TCL va justo, el LED se ve a saltos o parado sin que haya errores;
  // el latido lleva los fps medios desde el latido anterior (≈60 fluido, <20 a saltos, 0 congelado) y qué fondo emite (video, imagen, rojo o apagado).
  var fotogramas = 0, fpsMarca = { n: 0, t: Date.now() };
  function fpsAhora(ahora) { var dt = ahora - fpsMarca.t, f = dt > 0 ? Math.round((fotogramas - fpsMarca.n) * 1000 / dt) : 0; fpsMarca = { n: fotogramas, t: ahora }; return f; }
  // Memoria del WebView (15-nov-2026): una fuga lenta (vídeos o imágenes que no se liberan) va llenando la memoria de la TCL hasta que el
  // WebView se cuelga o lo mata Android; el refresco de las 05:00 la vacía, pero sin cifras no se ve si llega justa. El latido lleva los MB de JS en uso
  // (performance.memory, que dan los WebView Chromium); null si el WebView no lo da, sin romper el latido.
  function memoriaMB() { try { var m = typeof performance !== "undefined" && performance.memory; return m && m.usedJSHeapSize > 0 ? Math.round(m.usedJSHeapSize / 1048576) : null; } catch (e) { return null; } }
  window.addEventListener("error", function (ev) { anota(ev && (ev.error || ev.message)); });
  window.addEventListener("unhandledrejection", function (ev) { anota(ev && ev.reason); });
  for (i = 0; i < 46; i++) esporas.push({ x: Math.random(), y: Math.random(), v: 0.02 + Math.random() * 0.05, r: 2 + Math.random() * 4 });
  for (i = 0; i < 220; i++) gotas.push({ x: Math.random(), y: Math.random(), v: 0.5 + Math.random() * 0.7, l: 18 + Math.random() * 26 });

  function pad2(n) {
    n = Math.floor(n);
    return n < 10 ? "0" + n : String(n);
  }
  function tipoDe(c) {
    if (c >= 95) return "tormenta";
    if ((c >= 51 && c <= 67) || (c >= 80 && c <= 82) || (c >= 71 && c <= 77) || c === 85 || c === 86) return "lluvia";
    if (c >= 2) return "nubes";
    return "sol";
  }
  function horaMadrid() {
    try {
      return new Intl.DateTimeFormat("es-ES", { hour: "2-digit", minute: "2-digit", timeZone: "Europe/Madrid", hourCycle: "h23" }).format(new Date());
    } catch (e) {
      // Respaldo sin Intl (TCL antigua): horario de la UE, verano del último domingo de marzo al último de octubre a la 01:00 UTC.
      var d = new Date(), t = d.getTime(), y = d.getUTCFullYear();
      var ultimoDomingo = function (mes) { var x = new Date(Date.UTC(y, mes + 1, 0, 1)); return x.getTime() - x.getUTCDay() * 86400000; };
      var m = new Date(t + ((t >= ultimoDomingo(2) && t < ultimoDomingo(9)) ? 7200000 : 3600000));
      return pad2(m.getUTCHours()) + ":" + pad2(m.getUTCMinutes());
    }
  }
  function qs(name) {
    var s = location.search || "";
    var q = s.charAt(0) === "?" ? s.slice(1) : s;
    var parts = q.split("&");
    for (var j = 0; j < parts.length; j++) {
      var kv = parts[j].split("=");
      if (decodeURIComponent(kv[0] || "") === name) return decodeURIComponent((kv[1] || "").replace(/\+/g, " "));
    }
    return "";
  }
  var f = qs("clima");
  if (ICONO[f]) clima.forzado = f;

  // Señal de la maqueta del Hotel Creel en admira.store (13-nov-2026): el gemelo manda por postMessage la presencia
  // (quién se acerca a la puerta), quién entra en la zona de la puerta y la figura elegida, con la foto. Aquí se
  // pinta lo mismo que en la pantalla de la maqueta: mensaje, y retrato a la derecha con el nombre a la izquierda.
  var escena = { nivel: "lejos", quien: "", caraZona: null, caraSel: null, cara: null };
  var caras = {};
  var ORIGENES = { "https://admira.store": 1, "https://www.admira.store": 1 };
  var MSG = { cerca: function (q) { return q.toUpperCase() + " SE ACERCA…"; }, puerta: function (q) { return q === "Vecna" ? "VECNA ESTÁ AQUÍ · CORRE" : q === "Once" ? "ONCE PROTEGE LA CASA" : q.toUpperCase() + " EN LA PUERTA · EL MUNDO DEL REVÉS"; } };
  function cara(url) {
    if (!url) return null;
    if (caras[url]) return caras[url];
    var img = new Image(); img.decoding = "async"; img.src = url; caras[url] = img; return img;
  }
  function eligeCara() { escena.cara = escena.caraZona || escena.caraSel; if (escena.cara) cara(escena.cara.foto); if (typeof filtraPorPersonaje === "function" && lista) filtraPorPersonaje(); }
  function fotoValida(u) { try { var x = new URL(u); return x.protocol === "https:" && ORIGENES[x.origin] ? x.href : ""; } catch (e) { return ""; } }
  window.addEventListener("message", function (ev) {
    if (!ORIGENES[ev.origin] || !ev.data || typeof ev.data !== "object") return;
    var d = ev.data, nombre = String(d.quien || "").slice(0, 40);
    if (d.type === "creel-presencia") { escena.nivel = d.nivel === "puerta" || d.nivel === "cerca" ? d.nivel : "lejos"; escena.quien = nombre; }
    else if (d.type === "creel-zona") { escena.caraZona = d.id >= 0 && nombre ? { slug: String(d.slug || "").slice(0, 40), quien: nombre, foto: fotoValida(d.foto), texto: "EN LA PUERTA" } : null; eligeCara(); }
    else if (d.type === "creel-personaje") { escena.caraSel = d.id >= 0 && nombre ? { slug: String(d.slug || "").slice(0, 40), quien: nombre, foto: fotoValida(d.foto), texto: String(d.zona || "").slice(0, 40).toUpperCase() } : null; eligeCara(); }
  });
  function retrato(s) {
    var c = escena.cara, img = cara(c.foto);
    var h = H * 0.42, w = h * 0.82, x = W - 26 - w, y = H * 0.40, r = 18;
    if (lleno) { h = L.retH; w = h * 0.82; x = W - 30 - w; y = L.retY; r = 24; }
    function marco() { g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }
    g.save(); g.shadowColor = "#ff2a1f"; g.shadowBlur = 34 + Math.sin(s * 3) * 10; g.fillStyle = "#1a0509"; marco(); g.fill(); g.restore();
    g.save(); marco(); g.clip();
    if (img && img.complete && img.naturalWidth) {
      var k = Math.max(w / img.naturalWidth, h / img.naturalHeight), iw = img.naturalWidth * k, ih = img.naturalHeight * k;
      g.drawImage(img, x + (w - iw) / 2, y, iw, ih);
    } else { g.fillStyle = "#3a0a12"; g.fillRect(x, y, w, h); g.fillStyle = "#ffb3a8"; g.font = "800 40px ui-monospace, monospace"; g.textAlign = "center"; g.textBaseline = "middle"; g.fillText(c.quien.toUpperCase(), x + w / 2, y + h / 2); }
    g.restore();
    g.lineWidth = 5; g.strokeStyle = "#ff3326"; marco(); g.stroke();
    g.textAlign = "right"; g.textBaseline = "middle"; g.fillStyle = "#fff"; g.shadowColor = "#ff2a1f"; g.shadowBlur = 14;
    g.font = "900 " + (lleno ? L.nomF : 44) + "px ui-monospace, monospace"; g.fillText(c.quien.toUpperCase(), x - 26, y + h * 0.42);
    g.font = "700 " + (lleno ? L.texF : 24) + "px ui-monospace, monospace"; g.fillStyle = "#ffd9c7"; g.fillText(c.texto || "EN LA PUERTA", x - 26, y + h * 0.42 + (lleno ? L.texDy : 44)); g.shadowBlur = 0;
  }

  // Caché del clima (14-nov-2026): la TCL de Planeta puede arrancar sin red; se pinta la última temperatura
  // buena (hasta 6 h) en vez de «— °C» mientras llega la lectura en directo.
  var CLIMA_KEY = "creel-clima-v1", climaReintento = null;
  try {
    var cc = JSON.parse(localStorage.getItem(CLIMA_KEY) || "null");
    if (cc && typeof cc.temp === "number" && Date.now() - cc.t < 6 * 3600 * 1000) { clima.temp = cc.temp; clima.real = cc.real; clima.t = cc.t; clima.dia = typeof cc.dia === "boolean" ? cc.dia : null; }
  } catch (e) {}
  var climaBusy = false; // una sola petición de clima a la vez: colgadas no se apilan (cada 10 min, reintento de 2 min y evento online)
  // Corte de red largo con la TCL encendida (15-nov-2026): la caché solo vale 6 h también en marcha, no solo al arrancar.
  // Pasadas 6 h sin una lectura buena, el HUD deja la temperatura y el cielo de ayer y vuelve a «— °C» y «CLIMA —».
  var CLIMA_MAX = 6 * 3600 * 1000;
  function caducaClima() { if (clima.t && Date.now() - clima.t >= CLIMA_MAX) { clima.temp = null; clima.real = null; clima.t = 0; } }
  // Edad del clima para el latido (15-nov-2026): con «— °C» o una temperatura rara en la TCL no se sabía si Open-Meteo
  // no llega o si el HUD pinta una lectura vieja de caché. climaMin = minutos desde la última lectura buena (null si no hay).
  function climaMin() { try { return clima.t && Date.now() >= clima.t ? Math.round((Date.now() - clima.t) / 60000) : null; } catch (e) { return null; } }
  // De noche, sin sol (16-nov-2026 03:20): con cielo despejado a las 3 de la mañana la TCL pintaba «☀️ … SOL» y la luz dorada del Sol.
  // esNoche() usa is_day de Open-Meteo si la lectura tiene <= 30 min; si no (sin red, caché vieja), la tabla de salida/puesta
  // del Sol en Salou por mes, en hora de Madrid. De noche y despejado: «🌙 … DESPEJADO» y luz fría de luna. Forzado ?clima=sol manda.
  var ORTO = [[8.25, 17.75], [7.85, 18.35], [7.2, 19.2], [7.35, 20.4], [6.85, 20.9], [6.65, 21.3], [6.85, 21.25], [7.25, 20.75], [7.75, 20], [8, 19], [7.8, 17.75], [8.25, 17.5]];
  function esNoche() {
    try {
      if (typeof clima.dia === "boolean" && clima.t && Date.now() - clima.t <= 30 * 60000) return !clima.dia;
      var hm = String(horaMadrid()).split(":"), h = Number(hm[0]) + Number(hm[1]) / 60, o = ORTO[new Date().getMonth()];
      return isNaN(h) || !o ? false : (h < o[0] || h >= o[1]);
    } catch (e) { return false; }
  }
  function lunaClara() { return !clima.forzado && clima.real === "sol" && esNoche(); }
  function leeClima() {
    if (climaBusy) return;
    climaBusy = true;
    var hecho = false, ctl = typeof AbortController === "function" ? new AbortController() : null;
    function fin() { if (hecho) return false; hecho = true; clearTimeout(guarda); climaBusy = false; return true; }
    // Petición colgada a Open-Meteo (ni respuesta ni error, p. ej. TCP colgado en la wifi de Planeta): a los 15 s se aborta,
    // se conserva la última lectura buena (caché) y se reintenta en 2 min, como sin red (15-nov-2026).
    var guarda = setTimeout(function () { if (!fin()) return; if (ctl) { try { ctl.abort(); } catch (e) {} } if (x) { try { x.abort(); } catch (e) {} } fail(); }, 15000), x = null;
    var url = "https://api.open-meteo.com/v1/forecast?latitude=41.0868&longitude=1.1548&current=temperature_2m,weather_code,is_day&timezone=Europe%2FMadrid";
    function ok(j) {
      if (!fin()) return; // respuesta tardía de una petición ya abandonada: se ignora
      try {
        var c = j.current || {};
        if (typeof c.temperature_2m !== "number") throw 0;
        clima.temp = c.temperature_2m;
        clima.real = tipoDe(c.weather_code);
        clima.dia = c.is_day === 0 ? false : c.is_day === 1 ? true : null;
        clima.ok = true;
        clima.t = Date.now();
        try { localStorage.setItem(CLIMA_KEY, JSON.stringify({ t: Date.now(), temp: clima.temp, real: clima.real, dia: clima.dia })); } catch (e) {}
      } catch (e) {
        fail();
      }
    }
    // Sin red: se conserva la última lectura buena (ya cargada de caché) y se reintenta en 2 min.
    function fail() { fin(); clima.ok = false; caducaClima(); clearTimeout(climaReintento); climaReintento = setTimeout(leeClima, 2 * 60 * 1000); }
    function falla() { if (fin()) fail(); } // error de red de la petición en curso (una tardía ya abandonada no reprograma otro reintento)
    if (typeof fetch === "function") {
      fetch(url, { cache: "no-store", signal: ctl ? ctl.signal : undefined }).then(function (r) { if (!r.ok) throw 0; return r.json(); }).then(ok, falla);
    } else {
      x = new XMLHttpRequest();
      x.open("GET", url, true);
      x.onreadystatechange = function () {
        if (x.readyState !== 4 || hecho) return;
        if (x.status >= 200 && x.status < 300) {
          var j; try { j = JSON.parse(x.responseText); } catch (e) { falla(); return; }
          ok(j);
        } else falla();
      };
      x.onerror = falla;
      x.send();
    }
  }
  leeClima();
  setInterval(leeClima, 10 * 60 * 1000);

  function cielo(s) {
    var tipo = clima.forzado || clima.real || "sol";
    clima.tipo = tipo;
    if (tipo === "sol") {
      var luna = lunaClara();
      var luz = g.createRadialGradient(W / 2, -H * 0.2, 10, W / 2, -H * 0.2, W * 0.7);
      luz.addColorStop(0, luna ? "rgba(185,205,255,.38)" : "rgba(255,214,92,.6)");
      luz.addColorStop(0.4, luna ? "rgba(90,115,200,.14)" : "rgba(255,150,40,.22)");
      luz.addColorStop(1, luna ? "rgba(40,60,140,0)" : "rgba(255,120,0,0)");
      g.fillStyle = luz;
      g.fillRect(0, 0, W, H);
    } else {
      g.fillStyle = tipo === "nubes" ? "rgba(70,70,85,.45)" : tipo === "lluvia" ? "rgba(20,35,70,.55)" : "rgba(10,10,30,.68)";
      g.fillRect(0, 0, W, H);
      g.fillStyle = tipo === "nubes" ? "rgba(200,200,215,.55)" : "rgba(90,95,120,.75)";
      for (var k = 0; k < 6; k++) {
        var x = ((k * 0.19 + s * 0.01) % 1.2 - 0.1) * W;
        var y = H * (0.12 + (k % 2) * 0.08);
        for (var n = 0; n < 4; n++) {
          g.beginPath();
          g.arc(x + n * 46, y + (n % 2) * 12, 44, 0, 7);
          g.fill();
        }
      }
      if (tipo !== "nubes") {
        g.strokeStyle = "rgba(190,215,255,.6)";
        g.lineWidth = 2.2;
        g.beginPath();
        for (var d = 0; d < gotas.length; d++) {
          var drop = gotas[d];
          var yy = ((drop.y + s * drop.v) % 1) * H;
          var xx = drop.x * W;
          g.moveTo(xx, yy);
          g.lineTo(xx - drop.l * 0.3, yy + drop.l);
        }
        g.stroke();
      }
      if (tipo === "tormenta" && (s % 3.1) < 0.14) {
        g.fillStyle = "rgba(230,235,255,.45)";
        g.fillRect(0, 0, W, H);
        var lx = W * (0.3 + ((Math.floor(s / 3.1) * 0.37) % 0.5));
        var ly = 0;
        g.strokeStyle = "#f4f6ff";
        g.lineWidth = 6;
        g.shadowColor = "#9fb4ff";
        g.shadowBlur = 24;
        g.beginPath();
        g.moveTo(lx, ly);

          lx += Math.sin(ly * 7.3 + s) * 38;
          ly += 34;
          g.lineTo(lx, ly);
        }
        g.stroke();
        g.shadowBlur = 0;
      }
    }
  }

  function hud() {
    var t = clima.temp == null ? "\u2014 \u00B0C" : Math.round(clima.temp) + " \u00B0C";
    var tipo = clima.tipo || "sol";
    g.save();
    g.shadowColor = "rgba(0,0,0,.6)";
    g.shadowBlur = 10;
    g.fillStyle = "#fff";
    // Temperatura y, a su derecha, la hora; más pequeño (13-nov-2026, igual que la pantalla de la maqueta).
    var hy = lleno ? L.hudY : H * 0.44;
    g.font = "800 " + (lleno ? L.hudF : 40) + "px ui-monospace, monospace";
    g.textAlign = "left";
    g.textBaseline = "top";
    // Sin dato real ni forzado (TCL sin red y sin caché) no se inventa «Sol»: sin icono y «CLIMA —» (14-nov-2026).
    var conDato = !!(clima.forzado || clima.real);
    var noche = conDato && tipo === "sol" && lunaClara();
    var linea = (conDato ? (noche ? "\uD83C\uDF19" : (ICONO[tipo] || "")) + " " : "") + t;
    g.fillText(linea, 26, hy);
    g.fillStyle = "#ffd9c7";
    g.fillText(horaMadrid(), 26 + g.measureText(linea).width + 30, hy);
    g.font = "600 " + (lleno ? L.subF : 16) + "px ui-monospace, monospace";
    g.fillStyle = "rgba(255,255,255,.75)";
    var extra = clima.forzado ? " \u00B7 FORZADO" : (clima.ok ? " \u00B7 EN DIRECTO" : "");
    g.fillText("PORTAVENTURA \u00B7 " + (conDato ? (noche ? "DESPEJADO" : String(NOMBRE[tipo] || "").toUpperCase()) : "CLIMA \u2014") + extra, 28, hy + (lleno ? L.subDy : 50));
    g.restore();
  }

  function pinta(t) {
    var s = t / 1000;
    g.setTransform(escala, 0, 0, escala, 0, 0); // 8:3: escala 1 (igual que siempre); lleno: a la resolución real del visor
    if (negro) { g.fillStyle = "#000"; g.fillRect(0, 0, W, H); if (media && media.tagName === "VIDEO" && !media.paused) try { media.pause(); } catch (e) {} return; }
    if (intro && intro.on && pintaIntro()) return;   // intro a pantalla llena, sin tinte ni escena
