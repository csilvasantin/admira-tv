<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Hotel Creel · LED</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; cursor: none; -webkit-user-select: none; user-select: none; }
  body { position: fixed; inset: 0; }
  #box { position: absolute; left: 50%; top: 50%; width: 100vw; height: 37.5vw; max-height: 100vh; max-width: 266.666vh; transform: translate(-50%, -50%); background: #000; }
  #box canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<div id="box"><canvas id="led" width="1440" height="540"></canvas></div>
<script>
(function () {
  "use strict";
  var W = 1440, H = 540;
  var canvas = document.getElementById("led");
  var g = canvas.getContext("2d");
  var clima = { tipo: "sol", temp: null, ok: false, forzado: null, real: null };
  var ICONO = { sol: "\u2600\uFE0F", nubes: "\u2601\uFE0F", lluvia: "\uD83C\uDF27\uFE0F", tormenta: "\u26C8\uFE0F" };
  var NOMBRE = { sol: "Sol", nubes: "Nubes", lluvia: "Lluvia", tormenta: "Tormenta" };
  var colores = ["#ff4a3d", "#ffd23f", "#3fd2ff", "#5dff8a", "#ff6ad5"];
  var esporas = [];
  var gotas = [];
  var i;
  for (i = 0; i < 46; i++) esporas.push({ x: Math.random(), y: Math.random(), v: 0.02 + Math.random() * 0.05, r: 2 + Math.random() * 4 });
  for (i = 0; i < 220; i++) gotas.push({ x: Math.random(), y: Math.random(), v: 0.5 + Math.random() * 0.7, l: 18 + Math.random() * 26 });

  function pad2(n) {
    n = Math.floor(n);
    return n < 10 ? "0" + n : String(n);
  }
  function tipoDe(c) {
    if (c >= 95) return "tormenta";
    if ((c >= 51 && c <= 67) || (c >= 80 && c <= 82) || (c >= 71 && c <= 77) || c === 85 || c === 86) return "lluvia";
    if (c >= 2) return "nubes";
    return "sol";
  }
  function horaMadrid() {
    try {
      return new Intl.DateTimeFormat("es-ES", { hour: "2-digit", minute: "2-digit", timeZone: "Europe/Madrid", hourCycle: "h23" }).format(new Date());
    } catch (e) {
      // Respaldo sin Intl (TCL antigua): horario de la UE, verano del último domingo de marzo al último de octubre a la 01:00 UTC.
      var d = new Date(), t = d.getTime(), y = d.getUTCFullYear();
      var ultimoDomingo = function (mes) { var x = new Date(Date.UTC(y, mes + 1, 0, 1)); return x.getTime() - x.getUTCDay() * 86400000; };
      var m = new Date(t + ((t >= ultimoDomingo(2) && t < ultimoDomingo(9)) ? 7200000 : 3600000));
      return pad2(m.getUTCHours()) + ":" + pad2(m.getUTCMinutes());
    }
  }
  function qs(name) {
    var s = location.search || "";
    var q = s.charAt(0) === "?" ? s.slice(1) : s;
    var parts = q.split("&");
    for (var j = 0; j < parts.length; j++) {
      var kv = parts[j].split("=");
      if (decodeURIComponent(kv[0] || "") === name) return decodeURIComponent((kv[1] || "").replace(/\+/g, " "));
    }
    return "";
  }
  var f = qs("clima");
  if (ICONO[f]) clima.forzado = f;

  // Señal de la maqueta del Hotel Creel en admira.store (13-nov-2026): el gemelo manda por postMessage la presencia
  // (quién se acerca a la puerta), quién entra en la zona de la puerta y la figura elegida, con la foto. Aquí se
  // pinta lo mismo que en la pantalla de la maqueta: mensaje, y retrato a la derecha con el nombre a la izquierda.
  var escena = { nivel: "lejos", quien: "", caraZona: null, caraSel: null, cara: null };
  var caras = {};
  var ORIGENES = { "https://admira.store": 1, "https://www.admira.store": 1 };
  var MSG = { cerca: function (q) { return q.toUpperCase() + " SE ACERCA…"; }, puerta: function (q) { return q === "Vecna" ? "VECNA ESTÁ AQUÍ · CORRE" : q === "Once" ? "ONCE PROTEGE LA CASA" : q.toUpperCase() + " EN LA PUERTA · EL MUNDO DEL REVÉS"; } };
  function cara(url) {
    if (!url) return null;
    if (caras[url]) return caras[url];
    var img = new Image(); img.decoding = "async"; img.src = url; caras[url] = img; return img;
  }
  function eligeCara() { escena.cara = escena.caraZona || escena.caraSel; if (escena.cara) cara(escena.cara.foto); }
  function fotoValida(u) { try { var x = new URL(u); return x.protocol === "https:" && ORIGENES[x.origin] ? x.href : ""; } catch (e) { return ""; } }
  window.addEventListener("message", function (ev) {
    if (!ORIGENES[ev.origin] || !ev.data || typeof ev.data !== "object") return;
    var d = ev.data, nombre = String(d.quien || "").slice(0, 40);
    if (d.type === "creel-presencia") { escena.nivel = d.nivel === "puerta" || d.nivel === "cerca" ? d.nivel : "lejos"; escena.quien = nombre; }
    else if (d.type === "creel-zona") { escena.caraZona = d.id >= 0 && nombre ? { quien: nombre, foto: fotoValida(d.foto), texto: "EN LA PUERTA" } : null; eligeCara(); }
    else if (d.type === "creel-personaje") { escena.caraSel = d.id >= 0 && nombre ? { quien: nombre, foto: fotoValida(d.foto), texto: String(d.zona || "").slice(0, 40).toUpperCase() } : null; eligeCara(); }
  });
  function retrato(s) {
    var c = escena.cara, img = cara(c.foto);
    var h = H * 0.42, w = h * 0.82, x = W - 26 - w, y = H * 0.40, r = 18;
    function marco() { g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }
    g.save(); g.shadowColor = "#ff2a1f"; g.shadowBlur = 34 + Math.sin(s * 3) * 10; g.fillStyle = "#1a0509"; marco(); g.fill(); g.restore();
    g.save(); marco(); g.clip();
    if (img && img.complete && img.naturalWidth) {
      var k = Math.max(w / img.naturalWidth, h / img.naturalHeight), iw = img.naturalWidth * k, ih = img.naturalHeight * k;
      g.drawImage(img, x + (w - iw) / 2, y, iw, ih);
    } else { g.fillStyle = "#3a0a12"; g.fillRect(x, y, w, h); g.fillStyle = "#ffb3a8"; g.font = "800 40px ui-monospace, monospace"; g.textAlign = "center"; g.textBaseline = "middle"; g.fillText(c.quien.toUpperCase(), x + w / 2, y + h / 2); }
    g.restore();
    g.lineWidth = 5; g.strokeStyle = "#ff3326"; marco(); g.stroke();
    g.textAlign = "right"; g.textBaseline = "middle"; g.fillStyle = "#fff"; g.shadowColor = "#ff2a1f"; g.shadowBlur = 14;
    g.font = "900 44px ui-monospace, monospace"; g.fillText(c.quien.toUpperCase(), x - 26, y + h * 0.42);
    g.font = "700 24px ui-monospace, monospace"; g.fillStyle = "#ffd9c7"; g.fillText(c.texto || "EN LA PUERTA", x - 26, y + h * 0.42 + 44); g.shadowBlur = 0;
  }

  // Caché del clima (14-nov-2026): la TCL de Planeta puede arrancar sin red; se pinta la última temperatura
  // buena (hasta 6 h) en vez de «— °C» mientras llega la lectura en directo.
  var CLIMA_KEY = "creel-clima-v1", climaReintento = null;
  try {
    var cc = JSON.parse(localStorage.getItem(CLIMA_KEY) || "null");
    if (cc && typeof cc.temp === "number" && Date.now() - cc.t < 6 * 3600 * 1000) { clima.temp = cc.temp; clima.real = cc.real; }
  } catch (e) {}
  function leeClima() {
    var url = "https://api.open-meteo.com/v1/forecast?latitude=41.0868&longitude=1.1548&current=temperature_2m,weather_code,is_day&timezone=Europe%2FMadrid";
    function ok(j) {
      try {
        var c = j.current || {};
        if (typeof c.temperature_2m !== "number") throw 0;
        clima.temp = c.temperature_2m;
        clima.real = tipoDe(c.weather_code);
        clima.ok = true;
        try { localStorage.setItem(CLIMA_KEY, JSON.stringify({ t: Date.now(), temp: clima.temp, real: clima.real })); } catch (e) {}
      } catch (e) {
        fail();
      }
    }
    // Sin red: se conserva la última lectura buena (ya cargada de caché) y se reintenta en 2 min.
    function fail() { clima.ok = false; clearTimeout(climaReintento); climaReintento = setTimeout(leeClima, 2 * 60 * 1000); }
    if (typeof fetch === "function") {
      fetch(url, { cache: "no-store" }).then(function (r) { if (!r.ok) throw 0; return r.json(); }).then(ok).catch(fail);
    } else {
      var x = new XMLHttpRequest();
      x.open("GET", url, true);
      x.onreadystatechange = function () {
        if (x.readyState !== 4) return;
        if (x.status >= 200 && x.status < 300) {
          try { ok(JSON.parse(x.responseText)); } catch (e) { fail(); }
        } else fail();
      };
      x.onerror = fail;
      x.send();
    }
  }
  leeClima();
  setInterval(leeClima, 10 * 60 * 1000);

  function cielo(s) {
    var tipo = clima.forzado || clima.real || "sol";
    clima.tipo = tipo;
    if (tipo === "sol") {
      var luz = g.createRadialGradient(W / 2, -H * 0.2, 10, W / 2, -H * 0.2, W * 0.7);
      luz.addColorStop(0, "rgba(255,214,92,.6)");
      luz.addColorStop(0.4, "rgba(255,150,40,.22)");
      luz.addColorStop(1, "rgba(255,120,0,0)");
      g.fillStyle = luz;
      g.fillRect(0, 0, W, H);
    } else {
      g.fillStyle = tipo === "nubes" ? "rgba(70,70,85,.45)" : tipo === "lluvia" ? "rgba(20,35,70,.55)" : "rgba(10,10,30,.68)";
      g.fillRect(0, 0, W, H);
      g.fillStyle = tipo === "nubes" ? "rgba(200,200,215,.55)" : "rgba(90,95,120,.75)";
      for (var k = 0; k < 6; k++) {
        var x = ((k * 0.19 + s * 0.01) % 1.2 - 0.1) * W;
        var y = H * (0.12 + (k % 2) * 0.08);
        for (var n = 0; n < 4; n++) {
          g.beginPath();
          g.arc(x + n * 46, y + (n % 2) * 12, 44, 0, 7);
          g.fill();
        }
      }
      if (tipo !== "nubes") {
        g.strokeStyle = "rgba(190,215,255,.6)";
        g.lineWidth = 2.2;
        g.beginPath();
        for (var d = 0; d < gotas.length; d++) {
          var drop = gotas[d];
          var yy = ((drop.y + s * drop.v) % 1) * H;
          var xx = drop.x * W;
          g.moveTo(xx, yy);
          g.lineTo(xx - drop.l * 0.3, yy + drop.l);
        }
        g.stroke();
      }
      if (tipo === "tormenta" && (s % 3.1) < 0.14) {
        g.fillStyle = "rgba(230,235,255,.45)";
        g.fillRect(0, 0, W, H);
        var lx = W * (0.3 + ((Math.floor(s / 3.1) * 0.37) % 0.5));
        var ly = 0;
        g.strokeStyle = "#f4f6ff";
        g.lineWidth = 6;
        g.shadowColor = "#9fb4ff";
        g.shadowBlur = 24;
        g.beginPath();
        g.moveTo(lx, ly);
        while (ly < H * 0.8) {
          lx += Math.sin(ly * 7.3 + s) * 38;
          ly += 34;
          g.lineTo(lx, ly);
        }
        g.stroke();
        g.shadowBlur = 0;
      }
    }
  }

  function hud() {
    var t = clima.temp == null ? "\u2014 \u00B0C" : Math.round(clima.temp) + " \u00B0C";
    var tipo = clima.tipo || "sol";
    g.save();
    g.shadowColor = "rgba(0,0,0,.6)";
    g.shadowBlur = 10;
    g.fillStyle = "#fff";
    // Temperatura y, a su derecha, la hora; más pequeño (13-nov-2026, igual que la pantalla de la maqueta).
    g.font = "800 40px ui-monospace, monospace";
    g.textAlign = "left";
    g.textBaseline = "top";
    // Sin dato real ni forzado (TCL sin red y sin caché) no se inventa «Sol»: sin icono y «CLIMA —» (14-nov-2026).
    var conDato = !!(clima.forzado || clima.real);
    var linea = (conDato ? (ICONO[tipo] || "") + " " : "") + t;
    g.fillText(linea, 26, H * 0.44);
    g.fillStyle = "#ffd9c7";
    g.fillText(horaMadrid(), 26 + g.measureText(linea).width + 30, H * 0.44);
    g.font = "600 16px ui-monospace, monospace";
    g.fillStyle = "rgba(255,255,255,.75)";
    var extra = clima.forzado ? " \u00B7 FORZADO" : (clima.ok ? " \u00B7 EN DIRECTO" : "");
    g.fillText("PORTAVENTURA \u00B7 " + (conDato ? String(NOMBRE[tipo] || "").toUpperCase() : "CLIMA \u2014") + extra, 28, H * 0.44 + 50);
    g.restore();
  }

  function pinta(t) {
    var s = t / 1000;
    var fondo = g.createRadialGradient(W / 2, H * 1.15, 10, W / 2, H * 1.15, W * 0.75);
    fondo.addColorStop(0, "#ff3b2f");
    fondo.addColorStop(0.35, "#8c0b14");
    fondo.addColorStop(1, "#2a0308");
    g.fillStyle = fondo;
    g.fillRect(0, 0, W, H);
    var conContenido = fondoContenido();
    var rayo = (s % 7) < 0.12;
    if (rayo) {
      g.fillStyle = "rgba(255,240,240,.35)";
      g.fillRect(0, 0, W, H);
    }
    cielo(s);
    g.fillStyle = "rgba(243,230,255,.75)";
    for (var e = 0; e < esporas.length; e++) {
      var sp = esporas[e];
      var y = ((sp.y - s * sp.v) % 1 + 1) % 1;
      g.beginPath();
      g.arc(sp.x * W + Math.sin(s + sp.y * 9) * 12, y * H, sp.r, 0, 7);
      g.fill();
    }
    g.save();
    g.translate(W / 2, H * 0.165); // título bajo la fila de luces, con aire (13-nov-2026, como la pantalla de la maqueta)
    g.font = "900 128px Georgia, 'Times New Roman', serif";
    g.textAlign = "center";
    g.textBaseline = "middle";
    g.shadowColor = "#ff2a1f";
    g.shadowBlur = 30;
    g.lineWidth = 4;
    g.strokeStyle = "#ff3326";
    g.strokeText("STRANGER THINGS", 0, 0);
    g.restore();
    g.font = "700 28px ui-monospace, monospace";
    g.textAlign = "center";
    g.fillStyle = "#ffb3a8";
    g.shadowBlur = 0;
    g.fillText("H A W K I N S   \u00B7   H O T E L   C R E E L", W / 2, H * 0.365); // un 10 % más abajo (13-nov-2026)
    if (escena.cara) retrato(s);
    if (escena.nivel !== "lejos" && escena.quien) {
      g.font = "800 46px ui-monospace, monospace"; g.textAlign = "center"; g.fillStyle = "#fff"; g.shadowColor = "#ff2a1f"; g.shadowBlur = 16;
      g.fillText(MSG[escena.nivel](escena.quien), W / 2, H * 0.72); g.shadowBlur = 0;
    }
    // Luces A–Z en la franja superior; con un personaje elegido se encienden fijas las letras de su nombre (13-nov-2026).
    var letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
    var paso = escena.nivel === "puerta" ? 0.25 : escena.nivel === "cerca" ? 0.6 : 3;
    var nombre = escena.cara ? String(escena.cara.quien).toUpperCase().normalize("NFD").replace(/[^A-Z]/g, "") : "";
    for (var li = 0; li < letters.length; li++) {
      var lx = W * 0.05 + li * (W * 0.9 / 25);
      var ly = H * 0.026;
      var on = nombre ? nombre.indexOf(letters.charAt(li)) >= 0 : ((s + li * 0.37) % paso) / paso < 0.7;
      g.globalAlpha = on ? 1 : (nombre ? 0.12 : 0.18);
      g.fillStyle = colores[li % 5];
      g.shadowColor = colores[li % 5];
      g.shadowBlur = on ? (nombre ? 26 : 18) : 0;
      g.beginPath();
      g.arc(lx, ly, 12, 0, 7);
      g.fill();
      g.shadowBlur = 0;
      g.fillStyle = "#1a0a0a";
      g.font = "700 13px Georgia, serif";
      g.textAlign = "center";
      g.fillText(letters.charAt(li), lx, ly + 4.5);
      g.globalAlpha = 1;
    }
    g.font = "18px ui-monospace, monospace";
    g.textAlign = "right";
    g.fillStyle = "rgba(255,255,255,.45)";
    g.fillText(conContenido && lista[idx] ? "admira.tv \u00B7 " + String(lista[idx].title || listaNombre).slice(0, 60) : escena.quien || escena.cara ? "admira.tv \u00B7 maqueta en admira.store" : "admira.tv \u00B7 sin se\u00F1al", W - 16, H - 12);
    hud();
  }

  // Latido en la flota (Carlos, 13-nov-2026): este kiosko ES la pantalla LED del Hotel Creel y late en /signage/now
  // como «hotel-creel», con la pieza en antena (el personaje en pantalla) y un productor estable, igual que el Galleon.
  var SCREEN = (function () { var v = qs("screen"); return /^[a-z0-9][a-z0-9-]{1,79}$/.test(v) ? v : "hotel-creel"; })();
  var NOW_API = "https://api.admira.store/signage/now";
  var version = "";
  // Autoactualización sin mando (14-nov-2026): la TCL no se toca con el mando, así que el kiosko vuelve a leer
  // /version.json cada 10 min; si arrancó sin red, la versión se rellena al volver la red, y si cambia una versión
  // ya conocida (nuevo deploy de admira.tv) recarga la página para emitir el kiosko nuevo. Nunca recarga sin red.
  function leeVersion() {
    try { fetch("/version.json", { cache: "no-store" }).then(function (r) { if (!r.ok) throw 0; return r.json(); }).then(function (d) {
      var v = String(d && d.version || ""); if (!v) return;
      if (version && v !== version) { try { location.reload(); } catch (e) {} return; }
      version = v;
    }).catch(function () {}); } catch (e) {}
  }
  leeVersion();
  setInterval(leeVersion, 10 * 60 * 1000);
  // Contenido de admira.tv de fondo (Carlos, 13-nov-2026): la playlist de esta pantalla (/api/playlist?screen=hotel-creel,
  // la del mando) se reproduce en bucle detrás del título, con tinte Hawkins para que todo siga leyéndose. Vídeo mudo;
  // las imágenes duran su tiempo. Sin playlist, el fondo rojo de siempre. Se vuelve a leer cada minuto.
  // ?playlist=<pantalla> (Carlos, 14-nov-2026): emitir la playlist de OTRA pantalla (p. ej. corsair-galleon-100, el
  // teclado del Mac Studio) sin cambiar de identidad: el latido y las órdenes siguen siendo de hotel-creel.
  var PLAYLIST_SCREEN = (function () { var v = qs("playlist"); return /^[a-z0-9][a-z0-9-]{1,79}$/.test(v) ? v : SCREEN; })();
  var lista = [], listaNombre = "", listaRev = null, idx = -1, media = null, mediaOk = false, mediaTimer = null; var fallos = 0; // piezas seguidas que no cargan (sin red): freno a 30 s
  // Botón «📺 Pantallas» del mando (Carlos, 14-nov-2026): pantallas-on / pantallas-off / pantallas-toggle por la cola
  // /locations/cmd (la misma que el resto de players, con acuse). OFF para el vídeo y deja el fondo Stranger Things.
  var pantallasOn = (function () { try { return localStorage.getItem("creel-pantallas") !== "0"; } catch (e) { return true; } })();
  function pantallas(on) {
    pantallasOn = !!on;
    try { localStorage.setItem("creel-pantallas", pantallasOn ? "1" : "0"); } catch (e) {}
    if (!pantallasOn) { lista = []; listaRev = null; siguiente(); } else cargaLista();
    return pantallasOn;
  }
  var CMD_HOSTS = ["https://api.admira.store/locations/cmd", "https://brain.digitalavatar.ai/locations/cmd"], cmdHost = 0;
  var cmdState = { since: 0, init: false }, cmdBusy = false, cmdIdle = 0;
  function ejecutaOrden(c) {
    var cmd = String(c && c.cmd || "").replace(/^\//, "").split(/\s+/)[0].toLowerCase();
    if (cmd === "pantallas-on" || cmd === "pantallas" || cmd === "contenido-on") { pantallas(true); return "executed"; }
    if (cmd === "pantallas-off" || cmd === "contenido-off") { pantallas(false); return "executed"; }
    if (cmd === "pantallas-toggle") { pantallas(!pantallasOn); return "executed"; }
    if (cmd === "playout-sync" || cmd === "reload" || cmd === "recargar") { cargaLista(); return "executed"; }
    return "failed";
  }
  function acusa(c, status) {
    var body = JSON.stringify({ id: SCREEN, screen: SCREEN, cid: c.cid, action: c.action, status: status, queuedAt: Date.now() });
    return fetch(CMD_HOSTS[cmdHost] + "/ack", { method: "POST", headers: { "Content-Type": "application/json" }, body: body }).catch(function () {});
  }
  function sondeaOrdenes() {
    if (cmdBusy || typeof fetch !== "function") return;
    cmdBusy = true;
    fetch(CMD_HOSTS[cmdHost] + "?id=" + encodeURIComponent(SCREEN) + "&since=" + cmdState.since + "&t=" + Date.now(), { cache: "no-store" })
      .then(function (r) { if (!r.ok) throw 0; return r.json(); })
      .then(function (d) {
        if (!d) return;
        if (!cmdState.init) { cmdState.since = d.seq || 0; cmdState.init = true; return; } // el atraso anterior al arranque no se ejecuta
        var cmds = Array.isArray(d.commands) ? d.commands : [], seq = Promise.resolve(), activo = false;
        cmds.forEach(function (c) {
          if (typeof c.cid !== "number" || c.cid <= cmdState.since) return;
          if (c.screen && String(c.screen).toLowerCase() !== SCREEN) { cmdState.since = c.cid; return; }
          activo = true;
          seq = seq.then(function () { var st = ejecutaOrden(c); cmdState.since = c.cid; return acusa(c, st); });
        });
        cmdIdle = activo ? 0 : cmdIdle + 1;
        return seq;
      })
      .catch(function () { cmdHost = (cmdHost + 1) % CMD_HOSTS.length; cmdIdle++; })
      .then(function () { cmdBusy = false; setTimeout(sondeaOrdenes, cmdIdle >= 40 ? 10000 : 3000); });
  }
  sondeaOrdenes();
  // Si todas las piezas fallan seguidas (TCL sin red), no girar en bucle cerrado: esperar 30 s y reintentar.
  function falla() {
    fallos++;

    if (mediaTimer) clearTimeout(mediaTimer);
    media = null; mediaOk = false; fallos = 0;
    mediaTimer = setTimeout(siguiente, 30000);
  }
  function siguiente() {

    media = null; mediaOk = false;
    if (!lista.length) return;
    idx = (idx + 1) % lista.length;
    var it = lista[idx], esVideo = it.assetType !== "image", el = document.createElement(esVideo ? "video" : "img");
    el.crossOrigin = "anonymous";

      el.muted = true; el.playsInline = true; el.preload = "auto"; el.loop = false;

      var todas = dr.items.filter(function (i) { return i && /^https:\/\//.test(i.asset || "") && (i.assetType === "video" || i.assetType === "image" || i.assetType === "animation"); });

      var esVertical = function (i) { return (i.tags || []).some(function (t) { return t === "vertical" || t === "portrait"; }); };
      var horizontales = todas.filter(function (i) { return !esVertical(i); });

  function piezaEnAntena() {

    return { id: String(it.stockId || it.id || ""), title: String(it.title || ""), type: it.assetType, url: it.asset, playlist: { name: listaNombre, index: idx + 1, total: lista.length } };
  }

  // Zona de la tele para el latido: en una TCL sin Intl no debe romper beat() (y cortar /signage/now).
  function zonaTele() {

  }

    var item = c ? { id: "creel-" + String(c.quien).toLowerCase().replace(/[^a-z0-9]+/g, "-"), title: "Stranger Things \u00B7 " + c.quien + " \u00B7 " + (c.texto || "EN LA PUERTA"), type: "image", url: c.foto || "", playlist: pieza && pieza.playlist }
                 : pieza || { id: "creel-fondo", title: "Stranger Things \u00B7 Hawkins \u00B7 Hotel Creel", type: "animation", url: location.origin + "/creel/" };
