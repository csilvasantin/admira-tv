<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0a0c12">
<title>Puente de tinta · SY11-ab · Admira.tv</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
  :root { --bg: #0a0c12; --elev: #141826; --text: #f0e6ff; --muted: rgba(216,200,255,.65); --dim: rgba(216,200,255,.4);
    --violet: #aa88ff; --amber: #ffd866; --red: #ff6b6b; --green: #2ecc71; --border: rgba(170,136,255,.25); --mono: ui-monospace, Menlo, monospace; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: -apple-system, system-ui, Roboto, sans-serif; min-height: 100dvh; }
  main { max-width: 560px; margin: 0 auto; padding: 18px 16px 40px; }
  h1 { font-size: 21px; margin: 0 0 4px; } h1 span { color: var(--violet); }
  .sub { color: var(--muted); font-size: 13.5px; margin: 0 0 16px; }
  section { background: var(--elev); border: 1px solid var(--border); border-radius: 14px; padding: 14px; margin-bottom: 14px; }
  .estado { display: flex; align-items: center; gap: 10px; font-size: 16px; font-weight: 700; }
  .punto { width: 12px; height: 12px; border-radius: 50%; background: var(--dim); flex: none; }
  .punto.on { background: var(--green); box-shadow: 0 0 8px var(--green); } .punto.err { background: var(--red); box-shadow: 0 0 8px var(--red); } .punto.busy { background: var(--amber); box-shadow: 0 0 8px var(--amber); }
  .linea { font-size: 13px; color: var(--muted); margin-top: 6px; }
  button { font: inherit; font-size: 15px; color: var(--text); background: rgba(170,136,255,.12); border: 1px solid var(--border); border-radius: 999px; padding: 10px 16px; cursor: pointer; }
  button.primary { background: var(--violet); color: #0a0c12; border-color: var(--violet); font-weight: 700; width: 100%; padding: 14px; font-size: 16px; }
  button:disabled { opacity: .45; }
  .fila { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .check { display: flex; gap: 10px; align-items: center; font-size: 14px; margin-top: 10px; }
  .progreso { margin-top: 12px; } .pista { height: 8px; border-radius: 999px; background: rgba(255,255,255,.08); overflow: hidden; margin-top: 6px; }
  .pista i { display: block; height: 100%; width: 0; background: var(--violet); border-radius: inherit; transition: width .3s linear; }
  .vista { display: flex; gap: 12px; align-items: flex-start; }
  canvas#previo { width: 96px; height: 160px; border-radius: 6px; background: #fff; border: 1px solid rgba(255,255,255,.15); flex: none; }
  #registro { font-family: var(--mono); font-size: 11.5px; color: var(--muted); white-space: pre-wrap; max-height: 240px; overflow: auto; margin: 0; }
  .aviso { font-size: 13px; color: var(--amber); margin-top: 8px; }
</style>
</head>
<body>
<main>
  <h1>🖋️ Puente de <span>tinta</span></h1>
  <p class="sub">Este móvil hace de puente Bluetooth entre la flota de Admira.tv y la pantalla SY11-ab. Déjalo con esta página abierta, la pantalla encendida y cerca de la tinta.</p>

  <section>
    <div class="estado"><span class="punto" id="punto"></span><span id="estado">Sin conectar</span></div>
    <div class="linea" id="detalle">Pulsa «Conectar la SY11» y elige «SY11-ab» en la lista.</div>
    <div class="fila"><button type="button" class="primary" id="conectar">Conectar la SY11</button></div>
    <div class="aviso" id="aviso" hidden></div>
    <div class="progreso" id="progreso" hidden><div class="linea" id="faseEnvio"></div><div class="pista"><i id="barra"></i></div></div>
  </section>

  <section>
    <div class="vista">
      <canvas id="previo" width="480" height="800"></canvas>
      <div>
        <div class="linea" style="margin-top:0">En la tinta</div>
        <div id="actual" style="font-weight:700;margin-top:4px">—</div>
        <label class="check"><input type="checkbox" id="seguir"> Seguir novedades del Stock (#eink y Corsair)</label>
        <div class="fila"><button type="button" id="repintar" disabled>Repintar</button><button type="button" id="probar" disabled>Imagen de prueba</button></div>
      </div>
    </div>
  </section>

  <section>
    <div class="linea" style="margin:0 0 8px">Registro</div>
    <pre id="registro"></pre>
  </section>
</main>

<script src="/assets/eink-sy11.js"></script>
<script>
(function () {
  "use strict";
  // Puente Web Bluetooth de la SY11-ab (18-nov-2026): hace en Chrome (Android) lo que el puente del Mac Studio
  // (~/.admira-eink): escucha la cola /locations/cmd de la pantalla eink-sy11-ab, acusa, late en /signage/now y pinta
  // por Bluetooth con el mismo protocolo (assets/eink-sy11.js). Mientras este puente late, el del Mac se aparta.
  var E = window.EinkSY11, SCREEN = "eink-sy11-ab", MAQUINA = "Fold", VERSION = "eink-puente-web 18.11.2026.r2";
  var CMD_HOSTS = ["https://api.admira.store/locations/cmd", "https://brain.digitalavatar.ai/locations/cmd"], cmdHost = 0;
  var NOW_API = "https://api.admira.store/signage/now", INDICE = "https://stock.admira.store/stock/index.json";
  var PRESUPUESTO_S = 90, RITMO_MS = 90;
  var $ = function (id) { return document.getElementById(id); };
  function LS(k, v) { try { if (v === undefined) return JSON.parse(localStorage.getItem(k) || "null"); localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} return null; }
  var dormir = function (ms) { return new Promise(function (ok) { setTimeout(ok, ms); }); };

  var st = Object.assign({ actual: null, paused: false, follow: true, known: null, sends: 0, last: { at: null, status: "", error: "" }, firmware: "" }, LS("eink-puente") || {});
  function guarda() { LS("eink-puente", st); }
  function log(t) { var d = new Date(), l = d.toLocaleTimeString("es-ES") + " " + t; var r = $("registro"); r.textContent = (l + "\n" + r.textContent).slice(0, 6000); try { console.log("[puente]", t); } catch (e) {} }
  function estado(t, clase, detalle) { $("estado").textContent = t; $("punto").className = "punto" + (clase ? " " + clase : ""); if (detalle != null) $("detalle").textContent = detalle; }
  function horaLocal() { var d = new Date(), o = -d.getTimezoneOffset(), s = o >= 0 ? "+" : "-", p = function (n) { return ("0" + Math.abs(n)).slice(-2); };
    return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate()) + "T" + p(d.getHours()) + ":" + p(d.getMinutes()) + ":" + p(d.getSeconds()) + s + p(Math.trunc(o / 60)) + ":" + p(o % 60); }

  // ── Bluetooth ─────────────────────────────────────────────────────────
  var dispositivo = null, tx = null, rx = null, avisos = [];
  if (!navigator.bluetooth) { estado("Este navegador no tiene Bluetooth web", "err", "Abre esta página en Chrome para Android (o Chrome de escritorio)."); $("conectar").disabled = true; }
  async function eligeDispositivo() {
    dispositivo = await navigator.bluetooth.requestDevice({ filters: [{ namePrefix: "SY11" }], optionalServices: [E.SERVICIO] });
    dispositivo.addEventListener("gattserverdisconnected", function () { tx = rx = null; });
    log("elegida " + (dispositivo.name || "SY11"));
  }
  async function recuerdaDispositivo() {
    if (!navigator.bluetooth || !navigator.bluetooth.getDevices) return false;
    try { var l = await navigator.bluetooth.getDevices(); for (var i = 0; i < l.length; i++) if (/^SY11/.test(l[i].name || "")) { dispositivo = l[i]; dispositivo.addEventListener("gattserverdisconnected", function () { tx = rx = null; }); return true; } } catch (e) {}
    return false;
  }
  async function enlaza() {
    if (!dispositivo) throw new Error("sin pantalla elegida: pulsa «Conectar la SY11»");
    if (dispositivo.gatt.connected && tx) return;
    var servidor = await dispositivo.gatt.connect();
    var svc = await servidor.getPrimaryService(E.SERVICIO);
    tx = await svc.getCharacteristic(E.ESCRITURA); rx = await svc.getCharacteristic(E.AVISOS);
    await rx.startNotifications();
    rx.addEventListener("characteristicvaluechanged", function (ev) { var v = new Uint8Array(ev.target.value.buffer.slice(0)); avisos.push(v); });
  }
  function suelta() { try { if (dispositivo && dispositivo.gatt.connected) dispositivo.gatt.disconnect(); } catch (e) {} tx = rx = null; }
  async function saluda() {
    var antes = avisos.length;
    await tx.writeValueWithResponse(await E.saludo(E.MAC_SY11));
    for (var t = 0; t < 60; t++) { for (var i = antes; i < avisos.length; i++) if (avisos[i][0] === 0x11) return E.leeInfo(avisos[i]); await dormir(100); }
    return null;
  }
  function progreso(fase, pct) { $("progreso").hidden = pct == null; $("faseEnvio").textContent = fase || ""; $("barra").style.width = (pct || 0) + "%"; }

  var ocupado = false;
  // Un envío completo: conectar, saludo, 540 paquetes sin respuesta a ~90 ms, 8 s de margen, soltar.
  async function envia(datos, titulo) {
    var lista = E.paquetes(datos), t0 = Date.now();
    estado("Enviando a la SY11…", "busy", titulo);
    try {
      progreso("Conectando por Bluetooth…", 2);
      await enlaza();
      var info = await saluda();
      if (info) { st.firmware = info.firmware; } else log("la SY11 no contestó al saludo; sigo");
      for (var i = 0; i < lista.length; i++) {
        var t = Date.now();
        await tx.writeValueWithoutResponse(lista[i]);
        if (i % 20 === 0) progreso("Transmitiendo por Bluetooth… " + (i + 1) + "/" + lista.length, 4 + 90 * i / lista.length);
        var resto = RITMO_MS - (Date.now() - t); if (resto > 0) await dormir(resto);
      }
      progreso("Pintando la tinta…", 96);
      await dormir(8000);
      suelta();
      st.sends++; st.last = { at: horaLocal(), status: "ok", error: "" }; guarda();
      log("enviado «" + titulo + "» en " + Math.round((Date.now() - t0) / 1000) + " s");
      progreso(null); estado("Conectado: esperando órdenes", "on", "Último envío: " + titulo);
      return true;
    } catch (e) {
      suelta(); st.last = { at: horaLocal(), status: "error", error: String(e && e.message || e).slice(0, 160) }; guarda();
      log("ERROR enviando «" + titulo + "»: " + st.last.error); progreso(null); estado("Corte de Bluetooth", "err", st.last.error);
      return false;
    }
  }
  // Como el Mac (r9): si la pantalla corta, se reintenta mientras quepa otro envío en los 180 s que espera el acuse.
  async function enviaConReintento(datos, titulo) {
    var t0 = Date.now(), n = 1;
    while (true) {
      if (await envia(datos, titulo)) return true;
      if ((Date.now() - t0) / 1000 > PRESUPUESTO_S) { log("sin tiempo para otro intento tras " + n); return false; }
      n++; log("la pantalla cortó; intento " + n); await dormir(3000);
    }
  }

  // ── Imagen → tinta ────────────────────────────────────────────────────
  function cargaImagen(src) { return new Promise(function (ok, ko) { var i = new Image(); i.crossOrigin = "anonymous"; i.onload = function () { ok(i); }; i.onerror = function () { ko(new Error("la imagen no carga")); }; i.src = src; }); }
  function limpiaTitulo(t) {
    t = String(t || "").replace(/(^|\s)#\S+/g, " ").split(/\s+·\s+(?:Adaptación|Locución|16:9|9:16|subtítulos)/)[0];
    return Array.from(t).filter(function (c) { var n = c.codePointAt(0); return n < 0x2190 || (n >= 0x2c00 && n < 0xfe00); }).join("").replace(/\s+/g, " ").trim();
  }
  // Imagen: llena el panel si ya es 3:5; si no, contenida sobre blanco. Vídeo: póster en 480×640 + rótulo y título (como el Mac).
  async function compone(pieza, src, rotulo) {
    var cv = $("previo"), c = cv.getContext("2d"), img = await cargaImagen(src);
    c.fillStyle = "#fff"; c.fillRect(0, 0, 480, 800); c.imageSmoothingQuality = "high";
    var esImagen = /^(image|imagen)$/.test(String(pieza.type || ""));
    var ar = img.naturalWidth / img.naturalHeight;
    if (esImagen && Math.abs(ar - 0.6) < 0.04 && !rotulo) c.drawImage(img, 0, 0, 480, 800);
    else if (esImagen && !rotulo) { var k = Math.min(480 / img.naturalWidth, 800 / img.naturalHeight), w = img.naturalWidth * k, h = img.naturalHeight * k; c.drawImage(img, (480 - w) / 2, (800 - h) / 2, w, h); }
    else {
      var k2 = Math.min(480 / img.naturalWidth, 640 / img.naturalHeight), w2 = img.naturalWidth * k2, h2 = img.naturalHeight * k2;
      c.drawImage(img, (480 - w2) / 2, (640 - h2) / 2, w2, h2);
      if (rotulo) { c.fillStyle = "#f00"; c.font = "bold 20px Roboto, Arial, sans-serif"; c.textBaseline = "top"; c.fillText(rotulo, 14, 648); }
      c.fillStyle = "#000"; c.font = "bold 30px Roboto, Arial, sans-serif"; c.textBaseline = "top";
      var lineas = [], linea = ""; limpiaTitulo(pieza.title).split(" ").forEach(function (p) { var prueba = (linea + " " + p).trim(); if (c.measureText(prueba).width <= 452) linea = prueba; else { lineas.push(linea); linea = p; } });
      lineas.push(linea); lineas.filter(Boolean).slice(0, 3).forEach(function (l, i) { c.fillText(l, 14, 676 + i * 36); });
    }
    return E.empaqueta(E.trama(c.getImageData(0, 0, 480, 800).data));
  }
  function fuenteDe(p) { return /^(image|imagen|digital-twin)$/.test(String(p.type || "")) ? p.url : (p.thumbnail || p.poster || ""); }

  // ── Stock ─────────────────────────────────────────────────────────────
  var indice = { at: 0, items: [] };
  async function leeIndice() {
    if (Date.now() - indice.at < 60000 && indice.items.length) return indice.items;
    var r = await fetch(INDICE + "?_=" + Math.floor(Date.now() / 60000)), d = await r.json();
    indice = { at: Date.now(), items: Array.isArray(d) ? d : (d.items || d.assets || []) }; return indice.items;
  }
  async function porNumero(num) { var l = await leeIndice(); for (var i = 0; i < l.length; i++) if (Number(l[i].num) === num) return l[i]; indice.at = 0; l = await leeIndice(); for (i = 0; i < l.length; i++) if (Number(l[i].num) === num) return l[i]; return null; }
  function etiquetas(p) { return (p.tags || []).map(function (t) { return String(t).trim().replace(/^#/, "").toLowerCase(); }); }
  // Novedades: #eink (o el nombre de la pantalla) y lo etiquetado para el Corsair. Sin el teclado delante, la playlist
  // del Corsair se aproxima con sus etiquetas del Stock.
  function novedadesDe(items) {
    var ids = [];
    items.forEach(function (p) {
      if (!p || p.oculto || !/^(image|video|animation)$/.test(String(p.type))) return;
      var t = etiquetas(p), eink = t.indexOf("eink") >= 0 || t.indexOf(SCREEN) >= 0, corsair = t.some(function (x) { return x === "corsair" || x === "galleon" || x === "corsair-galleon-100"; });
      var otras = t.filter(function (x) { return x.indexOf("installation:") === 0 && x !== "installation:" + SCREEN; });
      if (otras.length && t.indexOf("installation:" + SCREEN) < 0) return;
      if (eink || corsair) ids.push({ id: String(p.id), origen: eink ? "STOCK" : "CORSAIR", pieza: p });
    });
    return ids;
  }

  // ── Órdenes de la flota ───────────────────────────────────────────────
  async function pintaPieza(pieza, rotulo) {
    var src = fuenteDe(pieza); if (!src) throw new Error("la pieza no tiene imagen");
    var datos = await compone(pieza, src, rotulo);
    var ok = await enviaConReintento(datos, "#" + pieza.num + " · " + limpiaTitulo(pieza.title).slice(0, 50));
    if (ok) { st.actual = { num: pieza.num, id: String(pieza.id), title: String(pieza.title || ""), src: src, type: pieza.type, rotulo: rotulo || "" }; guarda(); pintaActual(); }
    return ok;
  }
  async function ejecuta(c) {
    var cmd = String(c && c.cmd || "").replace(/^\//, "").split(/\s+/)[0].toLowerCase(), m;
    if (/^(resume|wake|encender|reanudar)$/.test(cmd)) { st.paused = false; guarda(); return "executed"; }
    if (/^(standby|apagar|parar)$/.test(cmd)) { st.paused = true; guarda(); return "executed"; }
    if (st.paused) return "failed";
    if (cmd === "follow" || cmd === "seguir" || cmd === "seguir-corsair" || cmd === "follow-galleon") { st.follow = true; st.known = null; guarda(); $("seguir").checked = true; return "executed"; }
    if (cmd === "follow-off" || cmd === "no-seguir") { st.follow = false; guarda(); $("seguir").checked = false; return "executed"; }
    if ((m = /^(?:content-|play|loop)(\d{1,6})$/.exec(cmd))) {
      var p = await porNumero(Number(m[1])); if (!p) return "failed";
      st.follow = false; $("seguir").checked = false; if (st.known && st.known.indexOf(String(p.id)) < 0) st.known.push(String(p.id)); guarda();
      return (await pintaPieza(p, "")) ? "executed" : "failed";
    }
    if (cmd === "content-clear") {
      var cv = $("previo"), cx = cv.getContext("2d"); cx.fillStyle = "#fff"; cx.fillRect(0, 0, 480, 800);
      var ok = await enviaConReintento(E.empaqueta(E.trama(cx.getImageData(0, 0, 480, 800).data)), "blanco");
      if (ok) { st.actual = null; guarda(); pintaActual(); } return ok ? "executed" : "failed";
    }
    if (cmd === "refresh" || cmd === "reload" || cmd === "recargar") return st.actual && (await pintaPieza({ num: st.actual.num, id: st.actual.id, title: st.actual.title, type: st.actual.type, url: st.actual.src, thumbnail: st.actual.src }, st.actual.rotulo)) ? "executed" : "failed";
    return "failed";
  }
  function acusa(c, status) {
    return fetch(CMD_HOSTS[cmdHost] + "/ack", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ id: SCREEN, screen: SCREEN, cid: c.cid, action: c.action, status: status, queuedAt: Date.now() }) }).catch(function () {});
  }
  var cola = { since: 0, init: false }, sondeando = false;
  async function sondea() {
    if (sondeando || ocupado || !dispositivo) return; sondeando = true;
    try {
      var r = await fetch(CMD_HOSTS[cmdHost] + "?id=" + encodeURIComponent(SCREEN) + "&since=" + cola.since + "&t=" + Date.now(), { cache: "no-store" });
      if (!r.ok) throw new Error("cola " + r.status);
      var d = await r.json();
      if (!cola.init) { cola.since = d.seq || 0; cola.init = true; return; }   // lo anterior a abrir el puente no se ejecuta
      var lista = Array.isArray(d.commands) ? d.commands : [];
      for (var i = 0; i < lista.length; i++) {
        var c = lista[i]; if (typeof c.cid !== "number" || c.cid <= cola.since) continue;
        cola.since = c.cid; if (c.screen && String(c.screen).toLowerCase() !== SCREEN) continue;
        if (/^\/?puente-/i.test(String(c.cmd || ""))) continue;   // el relevo es para el otro puente, no para este
        log("orden " + c.cmd); ocupado = true;
        var res; try { res = await ejecuta(c); } catch (e) { log("error: " + e.message); res = "failed"; } finally { ocupado = false; }
        await acusa(c, res); log("acuse " + res); beat();
      }
    } catch (e) { cmdHost = (cmdHost + 1) % CMD_HOSTS.length; }
    finally { sondeando = false; }
  }
  async function sigue() {
    if (!st.follow || st.paused || ocupado || !dispositivo) return;
    var nov; try { nov = novedadesDe(await leeIndice()); } catch (e) { return; }
    if (st.known === null) { st.known = nov.map(function (x) { return x.id; }); guarda(); log("memorizo " + st.known.length + " piezas; solo pinto las nuevas"); return; }
    var nuevas = nov.filter(function (x) { return st.known.indexOf(x.id) < 0; });
    if (!nuevas.length) return;
    nuevas.sort(function (a, b) { return a.id < b.id ? 1 : -1; });   // id = marca de tiempo: la más reciente primero
    var x = nuevas[0]; ocupado = true;
    try {
      log("pieza nueva #" + x.pieza.num + " (" + x.origen.toLowerCase() + ")");
      var ok = await pintaPieza(x.pieza, x.origen === "STOCK" ? "NUEVO EN EL STOCK" : "NUEVO EN EL CORSAIR");
      if (ok) { nuevas.forEach(function (y) { st.known.push(y.id); }); guarda(); }
    } catch (e) { log("novedad: " + e.message); st.known.push(x.id); guarda(); }
    finally { ocupado = false; }
  }
  function beat() {
    var a = st.actual, item = a ? { id: a.id, num: a.num, title: a.title, type: "image", url: a.src, thumbnail: a.src } : { id: "eink-espera", title: "Tinta electrónica · a la espera de contenido", type: "image", url: location.origin + "/eink/puente/" };
    var eink = { type: "eink", model: "SY11-ab", firmware: st.firmware || "", resolution: "480x800", palette: ["black", "white", "red", "yellow"], imageOnly: true, slowRefresh: true,
      status: st.last.status || "espera", lastSendAt: st.last.at, lastError: st.last.error || null, sends: st.sends, paused: !!st.paused, bridge: MAQUINA };
    if (!st.follow && a && Number(a.num) > 0) eink.pin = Number(a.num);
    var body = { screen: SCREEN, producer: "p-eink-" + SCREEN + "-fold", item: item, standby: !!st.paused, role: "eink", version: VERSION, loc: "eink", locName: "Tinta electrónica · SY11-ab", machine: MAQUINA,
      device: { display: { width: 480, height: 800, cssWidth: 480, cssHeight: 800, viewportWidth: 480, viewportHeight: 800, devicePixelRatio: 1, colorDepth: 2, orientation: "portrait-primary" },
        system: { os: "Android", platform: MAQUINA, language: navigator.language || "es", timezone: (function () { try { return Intl.DateTimeFormat().resolvedOptions().timeZone || ""; } catch (e) { return ""; } })() },
        hardware: { dedicated: true, model: "SY11-ab (batería MagSafe con tinta electrónica)" },
        software: { player: "Admira e-ink bridge", playerVersion: VERSION, webRelease: "", engine: "Web Bluetooth", userAgent: navigator.userAgent },
        eink: eink, network: { online: navigator.onLine !== false } },
      health: { ok: st.last.status !== "error", status: st.last.status === "error" ? "error" : (st.last.status || "espera"), error: st.last.error || null, source: "live" } };
    fetch(NOW_API, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) }).then(beatHecho).catch(function () {});
  }

  // Relevo: /signage/now solo acepta un productor por pantalla (concesión de 75 s) y el Mac Studio la renueva cada
  // 60 s. Esta orden le pide que se aparte (deja de latir y de atender la cola al menos 3 min); al caducar su
  // concesión, el latido de este puente la reclama y el Mac sigue apartado mientras lo vea latir.
  function releva() {
    var body = JSON.stringify({ id: SCREEN, screen: SCREEN, cmd: "puente-" + MAQUINA.toLowerCase() });
    fetch(CMD_HOSTS[cmdHost], { method: "POST", headers: { "Content-Type": "application/json" }, body: body })
      .then(function (r) { log(r.ok ? "relevo pedido al Mac Studio: en ~75 s este puente pasa a latir" : "no pude pedir el relevo (" + r.status + ")"); })
      .catch(function () { log("no pude pedir el relevo: sin red"); });
  }
  function beatHecho(r) { if (r && r.status === 409 && !beat.avisado) { beat.avisado = true; log("el Mac aún tiene la pantalla: espero a que caduque su turno"); } else if (r && r.ok && beat.avisado) { beat.avisado = false; log("este puente ya late por eink-sy11-ab"); } }

  // ── Pantalla del móvil ────────────────────────────────────────────────
  function pintaActual() { $("actual").textContent = st.actual ? ("#" + st.actual.num + " · " + limpiaTitulo(st.actual.title).slice(0, 60)) : "En blanco o sin pieza"; }
  var cerrojo = null;
  async function despierto() { try { if ("wakeLock" in navigator && document.visibilityState === "visible") { cerrojo = await navigator.wakeLock.request("screen"); } } catch (e) { log("no puedo mantener la pantalla encendida: " + e.message); } }
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "visible") despierto();
    else { $("aviso").hidden = false; $("aviso").textContent = "Vuelve a esta página: en segundo plano el móvil puede cortar el puente."; }
  });
  async function arranca() {
    $("conectar").textContent = "Cambiar de pantalla"; $("repintar").disabled = false; $("probar").disabled = false;
    estado("Conectado: esperando órdenes", "on", "Escuchando la cola de eink-sy11-ab cada 5 s. El Mac Studio se aparta mientras este puente late.");
    despierto(); releva(); beat();
    try { await enlaza(); var info = await saluda(); suelta(); if (info) { st.firmware = info.firmware; guarda(); log("SY11 al alcance: " + info.firmware + " · " + info.width + "×" + info.height); } else log("conectada, pero no contestó al saludo"); }
    catch (e) { log("prueba de conexión: " + e.message); estado("No llego a la SY11", "err", "Acércate a la pantalla y pulsa «Conectar la SY11» otra vez."); }
  }
  $("conectar").addEventListener("click", async function () {
    try { await eligeDispositivo(); await arranca(); } catch (e) { if (!/cancel/i.test(e.message)) log("conectar: " + e.message); }
  });
  $("seguir").checked = !!st.follow;
  $("seguir").addEventListener("change", function () { st.follow = $("seguir").checked; if (st.follow) st.known = null; guarda(); beat(); });
  $("repintar").addEventListener("click", async function () { if (ocupado) return; ocupado = true; try { await ejecuta({ cmd: "refresh" }); } finally { ocupado = false; } });
  $("probar").addEventListener("click", async function () {
    if (ocupado) return; ocupado = true;
    try {
      var cv = $("previo"), c = cv.getContext("2d"); c.fillStyle = "#fff"; c.fillRect(0, 0, 480, 800); c.fillStyle = "#e00000"; c.fillRect(0, 0, 480, 150);
      c.textAlign = "center"; c.textBaseline = "alphabetic"; c.fillStyle = "#fff"; c.font = "bold 60px Roboto, Arial, sans-serif"; c.fillText("PUENTE", 240, 98);
      c.fillStyle = "#000"; c.font = "bold 40px Roboto, Arial, sans-serif"; c.fillText("Fold → SY11", 240, 260);
      c.fillStyle = "#ffd400"; c.beginPath(); c.arc(240, 440, 100, 0, Math.PI * 2); c.fill(); c.lineWidth = 8; c.strokeStyle = "#000"; c.stroke();
      c.fillStyle = "#000"; c.font = "28px Roboto, Arial, sans-serif"; c.fillText("Web Bluetooth", 240, 640); c.fillStyle = "#e00000"; c.font = "24px Roboto, Arial, sans-serif";
      c.fillText(new Date().toLocaleString("es-ES", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" }), 240, 720); c.textAlign = "left";
      await enviaConReintento(E.empaqueta(E.trama(c.getImageData(0, 0, 480, 800).data)), "imagen de prueba del puente");
    } finally { ocupado = false; }
  });
  pintaActual();
  recuerdaDispositivo().then(function (si) { if (si) { log("SY11 recordada: no hace falta elegirla"); arranca(); } });
  setInterval(sondea, 5000); setInterval(sigue, 20000); setInterval(beat, 30000);   // 30 s: el Mac ve antes que tiene que apartarse
  window.__puente = { st: st, ejecuta: ejecuta, E: E };
})();
</script>
