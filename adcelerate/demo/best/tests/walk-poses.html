<!doctype html><html lang="es"><head><meta charset="utf-8"><base href="/adcelerate/demo/best/"><link rel="stylesheet" href="../css/interactive-scene.css?v=12.09.2026.r1.0942"><style>body{margin:0;padding:28px;background:#142723;color:#efffe4;font:16px system-ui}h1{font-size:26px}main{display:grid;grid-template-columns:repeat(8,1fr);gap:12px}article{background:#243a30;border:1px solid #6c8b63;border-radius:12px;padding:15px;text-align:center}.frame{height:290px;position:relative;margin:auto}.mapped-character{width:130px;height:268px;left:50%;transform:translateX(-50%)}p{max-width:900px;line-height:1.6}</style></head><body><h1>Personaje 1 · ocho fases de paso</h1><p>Animación 2D articulada a partir de la fotografía. Las fases avanzan según la distancia recorrida con las flechas. Al soltar las teclas, el personaje queda en reposo. No es una captura de movimiento ni un modelo 3D.</p><main id="poses"></main><script src="../js/pedestrian-motion.js?v=12.09.2026.r1.0942"></script><script>PedestrianMotion.poses.forEach((pose,i)=>{const card=document.createElement('article');card.innerHTML='<div class="frame"><div class="mapped-character is-walking"><div class="mapped-walk-rig"><div class="mapped-walk-part torso"></div><div class="mapped-walk-part left-leg"></div><div class="mapped-walk-part right-leg"></div></div></div></div><b>Paso '+(i+1)+'</b>';const sprite=card.querySelector('.mapped-character');sprite.style.setProperty('--left-leg',pose.left+'deg');sprite.style.setProperty('--right-leg',pose.right+'deg');sprite.style.setProperty('--body-bob',pose.bob+'px');sprite.style.setProperty('--body-tilt',pose.tilt+'deg');document.getElementById('poses').append(card);});</script></body></html>
