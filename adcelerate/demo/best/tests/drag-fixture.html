<!doctype html><html><head><base href="/adcelerate/demo/best/"><meta charset="utf-8"><link rel="stylesheet" href="../css/interactive-scene.css"><style>body{margin:0;background:#43534b}#scene{position:relative;width:1280px;height:720px}output#result{position:absolute;top:10px;left:10px;color:white}#screen{position:absolute;left:621px;top:278px;width:47px;height:130px;background:#131b15;border:2px solid white}</style></head><body><div id="scene"><div id="screen">KIOSCO</div></div><output id="camera-check" style="position:absolute;top:35px;color:white">Cámara: 0</output><output id="result">Sin selección</output><script src="../js/hidden-ui.js"></script><script src="../js/dooh-surfaces.js"></script><script src="../js/pedestrian-layers.js"></script><script src="../js/pedestrian-music.js"></script><script src="../js/pedestrian-motion.js?v=12.09.2026.r19.2238"></script><script src="../js/interactive-scene.js"></script><script>
const panorama={getPano:()=>InteractiveScene.anchor.pano,getVisible:()=>true,getPov:()=>PedestrianLayers.reference.pov,getZoom:()=>PedestrianLayers.reference.zoom};
const mapping=InteractiveScene.create({getPanorama:()=>panorama,container:document.getElementById('scene'),warp:(w,h,p)=>`matrix(${(p[1][0]-p[0][0])/w},${(p[1][1]-p[0][1])/w},${(p[3][0]-p[0][0])/h},${(p[3][1]-p[0][1])/h},${p[0][0]},${p[0][1]})`,onSelect:(number,options)=>document.getElementById('result').textContent=JSON.stringify({number,...options})});mapping.layout();let cameraEvents=0;addEventListener("keydown",e=>{if(e.key.startsWith("Arrow"))document.getElementById("camera-check").textContent="Cámara: "+(++cameraEvents)},true);
</script></body></html>
