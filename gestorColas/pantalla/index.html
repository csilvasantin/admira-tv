<body>

<script>
(function(){

  dice:(n,nom)=>nom?nom+', tu pedido '+M.nombre+' está preparado. Pedido '+n+', recógelo en barra.':'Pedido '+n+', ya está listo. Recógelo en barra, por favor.',
  html:(n,nom)=>nom?'<b>'+nom+'</b>, tu pedido '+M.nombre+' está preparado ☕<br><small>Pedido '+n+' · recógelo en barra</small>':'Pedido <b>'+n+'</b> listo ☕ ¡Recógelo en barra!',voz:'es-ES'},

  dice:(n,nom)=>nom?nom+', your '+M.nombre+' order is ready. Order '+n+', please collect it at the counter.':'Order '+n+' is ready. Please collect it at the counter.',
  html:(n,nom)=>nom?'<b>'+nom+'</b>, your '+M.nombre+' order is ready ☕<br><small>Order '+n+' · collect at the counter</small>':'Order <b>'+n+'</b> is ready ☕ Collect at the counter!',voz:'en-GB'}};
const esc=x=>String(x||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function textos(){const t=T[lang];document.documentElement.lang=lang;$('hReci').textContent=t.reci;$('hPrep').textContent=t.prep;$('hListo').textContent=t.listo;$('pie').textContent=t.pie;$('lang').textContent=t.btn;$('tienda').textContent=tienda?'· '+tienda:'';if(ultimo)pintar(ultimo);try{pintaVoz();}catch(_){}}
// Estado vivo (Carlos, 7-oct-2026): la pantalla queda abierta horas en el iPad. Los pedidos se siguen por ID
// (no por número: tras /reiniciar el A001 nuevo NO es el A001 viejo), una sola petición a la vez con
// límite de 5 s, y al detectar un reinicio se vacía la cola de avisos, se corta la voz y se quita el bocadillo.
const vistos=new Map(),cola=[],recientes=new Set(),said=window.__admiritoSaid=[];let primera=true,hablando=false,vozOk=P.get('voz')!=='0'&&(()=>{try{return localStorage.getItem('gc:voz')!=='off';}catch(_){return true;}})(),ultimo=null,enVuelo=false,idsPrev=new Set(),gen=0,fallos=0;

// Sin pantalla intermedia (Carlos, 7-oct-2026): ya no se pide «Toca para que Admirito avise en voz alta».
// La voz se intenta siempre; si el navegador exige un gesto, el primer toque que haya en la pantalla la

let desbloqueada=false;

  if(window.top===window)try{const e=document.documentElement;(e.requestFullscreen||e.webkitRequestFullscreen||function(){}).call(e);}catch(_){}}

// Un aviso por pedido con TOPE DURO independiente del audio (Carlos, 7-oct-2026: con voz real el bocadillo

// corta la voz (speechSynthesis.cancel) y se pasa al siguiente. El vigilante de tic() lo fuerza si algo falla.

function decir(p){const g=gen,t=T[lang],num=String(p.numero).replace(/[^A-Z0-9]/gi,''),nom=p.nombre||'';
  if(!sigueListo(p))return Promise.resolve();

  let via='pantalla';const ss=window.speechSynthesis;
  return new Promise(fin=>{let hecho=false,timer=0;actual=p;inicioAviso=Date.now();

      if(motivo!=='fin'){try{ss&&ss.cancel();}catch(_){}}
      said.push({id:p.id,numero:num,nombre:nom||null,text:texto,via,lang:t.voz,at:inicioAviso,ms:Date.now()-inicioAviso,motivo});
      if(motivo==='cortado'||cola.length){if(g===gen)b.classList.remove('on');return fin();}
      setTimeout(()=>{if(g===gen&&!actual)b.classList.remove('on');fin();},900);};
    cortar=()=>cerrar('cortado');
    const plazo=()=>{const tope=cola.length?4500:6000;topeAviso=tope;const resto=tope-(Date.now()-inicioAviso);if(resto<=0)return cerrar('tope');timer=setTimeout(plazo,Math.min(resto,500));};
    plazo();
    // Sin voz (parada a mano, sin soporte o bloqueada por el navegador) el bocadillo es el único aviso: se queda 5 s.
    const SOLO_TEXTO=5000;
    if(!vozOk||!ss||typeof SpeechSynthesisUtterance!=='function'){setTimeout(()=>cerrar('sin-voz'),SOLO_TEXTO);return;}
    try{ss.cancel();const u=new SpeechSynthesisUtterance(texto);u.lang=t.voz;u.rate=1.02;const v=vozDe(ss,t.voz);if(v)u.voice=v;via='voz-'+t.voz;
      u.onend=()=>cerrar('fin');u.onerror=()=>setTimeout(()=>cerrar('error-voz'),Math.max(0,SOLO_TEXTO-(Date.now()-inicioAviso)));ss.speak(u);}catch(_){setTimeout(()=>cerrar('error-voz'),SOLO_TEXTO);}});}
async function siguiente(){if(hablando)return;hablando=true;try{while(cola.length){const p=cola.shift();await decir(p);}}finally{hablando=false;}}
const chips=(a,nuevos)=>a.length?a.map(p=>'<span class="n'+(nuevos&&nuevos.has(p.id)?' nuevo':'')+'">'+esc(p.numero)+(p.nombre?'<small>'+esc(p.nombre)+'</small>':'')+'</span>').join(''):'<span class="vacio">'+T[lang].vacio+'</span>';
// Vaso para llevar con la manga del color de la marca (dibujo propio, sin logotipo).
const VASO='<svg viewBox="0 0 34 46" aria-hidden="true"><path d="M5 12h24l-2.6 31a3 3 0 0 1-3 2.7H10.6a3 3 0 0 1-3-2.7z" fill="#fff"/><path d="M6.3 22h21.4l-1 12H7.3z" fill="var(--c)"/><circle cx="17" cy="28" r="4.2" fill="#fff"/><rect x="3" y="7" width="28" height="6" rx="2.5" fill="#f2f0eb"/><rect x="7" y="3" width="20" height="5" rx="2.5" fill="#fff"/></svg>';
// Reloj del relé: el avance se calcula con la hora del servidor, así no depende del reloj del iPad.
let desfase=0;const ahoraRele=()=>Date.now()+desfase;
const mmss=ms=>{const s=Math.max(0,Math.ceil(ms/1000));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');};
function pintaRecibidos(){const d=ultimo;if(!d)return;const caja=$('reci'),lista=d.recibido||[],dur=Math.max(1,+d.recibido_s||30)*1000,ids=new Set(lista.map(p=>p.id));
  for(const el of [...caja.children])if(!ids.has(el.dataset.id))el.remove();
  if(!lista.length){if(!caja.firstChild)caja.innerHTML='<span class="vacio">'+T[lang].vacio+'</span>';return;}
  for(const el of [...caja.children])if(!el.dataset.id)el.remove();
  lista.forEach(p=>{let el=[...caja.children].find(x=>x.dataset.id===p.id);
    if(!el){el=document.createElement('div');el.className='r';el.dataset.id=p.id;el.innerHTML='<div class="rn"><span></span><small></small><i></i></div><div class="via" role="progressbar" aria-valuemin="0" aria-valuemax="100"><div class="llen"></div><div class="vaso">'+VASO+'</div></div>';caja.append(el);}
    const desde=Date.parse(p.pagado||p.creado)||ahoraRele(),f=Math.min(1,Math.max(0,(ahoraRele()-desde)/dur)),pc=(f*100).toFixed(1)+'%';
    el.querySelector('.rn span').textContent=p.numero;el.querySelector('.rn small').textContent=p.nombre||'';el.querySelector('.rn i').textContent=mmss(dur*(1-f));
    el.querySelector('.llen').style.width=pc;el.querySelector('.vaso').style.left=pc;const via=el.querySelector('.via');via.setAttribute('aria-valuenow',String(Math.round(f*100)));via.setAttribute('aria-label',T[lang].pasa+' '+mmss(dur*(1-f)));});}

function pintar(d){ultimo=d;$('listo').innerHTML=chips([...(d.listo||[])].reverse(),recientes); /* FIFO: el más antiguo arriba */$('prep').innerHTML=chips([...(d.preparando||[])]);pintaRecibidos();}
async function tic(){if(enVuelo)return;enVuelo=true;window.__pantallaStats.tics++;const ac=new AbortController(),to=setTimeout(()=>ac.abort(),5000);
  try{const r=await fetch('/gestorColas/api/estado?sala='+sala+'&publico=1&_='+Date.now(),{cache:'no-store',signal:ac.signal});const d=await r.json();if(!d.ok)throw 0;
  {const t=Date.parse(d.ahora);if(t)desfase=t-Date.now();}
  const todos=[...(d.recibido||[]),...(d.preparando||[]),...(d.listo||[])],ids=new Set(todos.map(p=>p.id));
  // Reinicio: ninguno de los pedidos de antes sigue y la numeración ha vuelto atrás (o la cola está vacía).
  const num=p=>+String(p.numero).replace(/\D/g,'')||0,maxPrev=Math.max(0,...[...vistos.values()].map(v=>v.n));
  if(idsPrev.size&&![...idsPrev].some(id=>ids.has(id))&&(!todos.length||Math.max(...todos.map(num))<maxPrev)){callar();vistos.clear();recientes.clear();window.__pantallaStats.resets++;}

  catch(_){if(++fallos>=2){document.body.dataset.ok='0';$('pie').textContent=T[lang].off;}}finally{clearTimeout(to);enVuelo=false;}}
$('lang').onclick=e=>{e.stopPropagation();lang=lang==='es'?'en':'es';textos();};
// Voz de los avisos a mano (Carlos, 7-oct-2026): se puede parar y volver a activar por si molesta. Se recuerda
// en este dispositivo; ?voz=0 arranca siempre en silencio (así la abre el gemelo cuando se le para el audio de colas).
function pintaVoz(){const b=$('voz');b.textContent=vozOk?'🔊':'🔇';b.setAttribute('aria-pressed',String(vozOk));b.title=b.ariaLabel=lang==='en'?(vozOk?'Stop voice announcements':'Turn voice announcements on'):(vozOk?'Parar los avisos de voz':'Activar los avisos de voz');}
$('voz').onclick=e=>{e.stopPropagation();vozOk=!vozOk;try{if(vozOk)localStorage.removeItem('gc:voz');else localStorage.setItem('gc:voz','off');}catch(_){}if(!vozOk){try{speechSynthesis.cancel();}catch(_){}}pintaVoz();};pintaVoz();

try{navigator.wakeLock&&navigator.wakeLock.request('screen').catch(()=>{});document.addEventListener('visibilitychange',()=>{if(!document.hidden&&navigator.wakeLock)navigator.wakeLock.request('screen').catch(()=>{});});}catch(_){}

// Se compara con el sello que había AL ABRIR (antes era el <meta> de esta página, que no se sella con el
// release: la pantalla se recargaba sola cada minuto y volvía a pedir el toque de voz).
let V0='';const sello=()=>fetch('/version.json?_='+Date.now(),{cache:'no-store'}).then(r=>r.json()).then(v=>{if(!v.version)return;if(!V0){V0=v.version;return;}if(v.version!==V0&&!hablando)location.reload();}).catch(()=>{});sello();setInterval(sello,60000);

})();
