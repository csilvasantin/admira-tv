<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Kiosko Prensa · Clear Channel</title>
  <!-- Tótem DOOH a pantalla completa para iPhone/iPad: envuelve el player canal.html
       en modo kiosko, con metas de PWA standalone (Añadir a inicio → sin barras de
       Safari) y Screen Wake Lock (la pantalla no se apaga). -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Kiosko BCN">
  <meta name="theme-color" content="#000000">
  <link rel="manifest" href="/totem.webmanifest">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="apple-touch-icon" href="/favicon.svg">
  <style>
    html,body{margin:0;height:100%;width:100%;background:#000;overflow:hidden;
      -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
    #p{position:fixed;inset:0;width:100vw;height:100vh;height:100dvh;border:0;background:#000}
    /* cortina inicial hasta que el player carga */
    #splash{position:fixed;inset:0;background:#000;color:#8ab;display:flex;align-items:center;
      justify-content:center;font:600 14px ui-monospace,Menlo,monospace;letter-spacing:.12em;
      z-index:2;transition:opacity .6s;text-transform:uppercase}
    #splash.hide{opacity:0;pointer-events:none}
  </style>
</head>
<body>
  <div id="splash">◐ Kiosko Clear Channel…</div>
  <iframe id="p" allow="autoplay; fullscreen" allowfullscreen></iframe>
  <script>
    // ── Kiosko destino: ?n=NNN (default 001) o ?screen=/?circuit= explícitos ──
    var qs = new URLSearchParams(location.search);
    var n  = (qs.get('n') || '001').replace(/[^0-9]/g,''); n = ('000'+n).slice(-3);
    var circuit = qs.get('circuit') || ('bcn-kiosk-' + n);
    var screen  = qs.get('screen')  || ('bcn-kiosk-' + n + '-led');
    var sound   = qs.get('sound') === '1';           // por defecto silenciado (autoplay iOS)
    var src = '/canal.html?circuit=' + encodeURIComponent(circuit)
            + '&screen='  + encodeURIComponent(screen)
            + '&embed=mupi&clean=1&chrome=0&kiosk=1'
            + (sound ? '' : '&muted=1');
    // El tótem es un envoltorio, no una jaula: lo que no es suyo se lo pasa al canal tal cual
    // (sincro de canal, tag, medio, fresh, machine…). Sin esto no se podía pedir por URL que
    // este tótem emitiera EN SINCRONÍA con otra pantalla — había que mandarle un comando después.
    var PROPIOS = ['n','circuit','screen','sound'];
    qs.forEach(function(v,k){
      if(PROPIOS.indexOf(k)>=0) return;
      if(!/^[a-zA-Z0-9_.-]{1,24}$/.test(k)) return;   // nada de claves raras en la URL del player
      src += '&' + encodeURIComponent(k) + '=' + encodeURIComponent(v);
    });
    var f = document.getElementById('p');
    f.src = src;
    f.addEventListener('load', function(){ setTimeout(function(){ document.getElementById('splash').classList.add('hide'); }, 900); });

    // ── Screen Wake Lock: la pantalla no se duerme; se reengancha al volver ──
    // El candado se PIERDE cada vez que la página deja de estar visible (iOS lo suelta al
    // bloquear o al pasar a segundo plano) y no vuelve solo. Antes esto se tragaba en
    // silencio: un tótem que había perdido el candado se veía IGUAL que uno que lo tenía,
    // y solo te enterabas al encontrarte la pantalla apagada horas después. Ahora se
    // reintenta en bucle, se deja el estado a la vista de quien lo instala y se puede
    // auditar desde fuera con window.__wake.
    var wl = null, wakeFail = '';
    window.__wake = function(){ return { activo: !!wl, motivo: wakeFail }; };
    async function lock(){
      if(wl) return;
      if(!('wakeLock' in navigator)){ wakeFail='este navegador no tiene Screen Wake Lock'; badge(); return; }
      try{
        wl = await navigator.wakeLock.request('screen');
        wakeFail=''; badge();
        wl.addEventListener('release', function(){ wl=null; });   // se re-pide en el próximo ciclo
      }catch(e){ wl=null; wakeFail=String(e&&e.message||e); badge(); }   // p.ej. modo de bajo consumo
    }
    // Aviso DISCRETO y solo cuando el candado NO está: la doctrina DOOH dice que nada tapa
    // la emisión, así que es una línea pequeña abajo, se va sola y ?wakebadge=0 la quita.
    var bEl=null;
    function badge(){
      if(qs.get('wakebadge')==='0') return;
      if(!wakeFail){ if(bEl){ bEl.remove(); bEl=null; } return; }
      if(!bEl){
        bEl=document.createElement('div');
        bEl.style.cssText='position:fixed;left:10px;bottom:10px;z-index:3;padding:5px 9px;border-radius:7px;'+
          'background:rgba(0,0,0,.62);color:#ffb37c;font:600 11px ui-monospace,Menlo,monospace;letter-spacing:.06em;'+
          'pointer-events:none;transition:opacity .8s';
        document.body.appendChild(bEl);
      }
      bEl.textContent='⚠ pantalla puede apagarse: '+wakeFail;
      bEl.style.opacity='1';
      clearTimeout(badge._t); badge._t=setTimeout(function(){ if(bEl) bEl.style.opacity='0'; }, 9000);
    }
    document.addEventListener('visibilitychange', function(){ if(document.visibilityState==='visible'){ wl=null; lock(); } });
    window.addEventListener('pageshow', function(){ wl=null; lock(); });   // vuelta desde la caché de iOS
    setInterval(lock, 20000);        // red de seguridad: si se soltó, se vuelve a pedir
    lock();
    // primer gesto → asegura wake lock + (si sound) desmutea el iframe recargando con sound
    document.body.addEventListener('click', function(){ lock(); }, {once:false});
  </script>
  <script src="/assets/admira-version-watch.js?v=13.08.2026.r22.1430" defer></script>
</body>
</html>
