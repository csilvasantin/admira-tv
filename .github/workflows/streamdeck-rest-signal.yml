name: Stream Deck rest signal

on:
  pull_request:
    paths:
      - tools/streamdeck-bridge/senal_reposo.py
      - tools/streamdeck-bridge/test_senal_reposo.py
      - .github/workflows/streamdeck-rest-signal.yml
  push:
    branches: [main]
    paths:
      - tools/streamdeck-bridge/senal_reposo.py
      - tools/streamdeck-bridge/test_senal_reposo.py
      - .github/workflows/streamdeck-rest-signal.yml

permissions:
  contents: read

jobs:
  signal:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/streamdeck-bridge/test_senal_reposo.py
