name: Publicar admira.tv

# Cada merge en main publica admira.tv con ./deploy.sh cf (Carlos, 14-oct-2026), como ya hace admira.biz:
# antes había que sellar y publicar a mano desde un Mac, y un merge podía quedarse sin salir.
# Si el merge ya trae su propio sello (más nuevo que producción), se publica tal cual con su firma;
# si no, se sella aquí: r siguiente a la de producción, firma «autor del PR · GitHubActions» y la
# novedad sale del título del PR. Ver docs/publicacion-tv.md.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publicar-admira-tv
  cancel-in-progress: false

jobs:
  publicar:
    if: github.repository == 'csilvasantin/admira-tv'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Publicar
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "✗ falta el secreto CLOUDFLARE_API_TOKEN en el repo"; exit 1; }
          # Un token mal pegado (espacios, salto de línea o la línea de al lado) rompe la cabecera de wrangler.
          token="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | grep -oE '[A-Za-z0-9_-]{40,}' | head -1 || true)"
          test -n "$token" || { echo "✗ CLOUDFLARE_API_TOKEN no tiene forma de token de Cloudflare: vuelve a guardarlo"; exit 1; }
          echo "::add-mask::$token"
          export CLOUDFLARE_API_TOKEN="$token"

          al_dia() { git fetch --quiet origin main && [ "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" ]; }
          al_dia || { echo "· main ya va por delante de este commit: lo publica la siguiente ejecución."; exit 0; }

          # Normativa: como mucho 4 publicaciones por hora. Si la última salió hace menos de 15 min, se espera.
          vivo="$(curl -fsS "https://admira.tv/version.json?t=$(date +%s)")"
          ultima="$(printf '%s' "$vivo" | jq -r '.deployedAt // empty')"
          if [ -n "$ultima" ]; then
            espera=$(( $(date -d "$ultima" +%s) + 900 - $(date +%s) ))
            if [ "$espera" -gt 0 ]; then
              echo "· máximo 4 publicaciones por hora: la última fue hace menos de 15 min, espero ${espera}s."
              sleep "$espera"
              al_dia || { echo "· mientras esperaba entró otro merge: lo publica la siguiente ejecución."; exit 0; }
              vivo="$(curl -fsS "https://admira.tv/version.json?t=$(date +%s)")"
            fi
          fi

          # Sello: el del repo si es de hoy y más nuevo que producción (alguien selló a mano); si no, uno nuevo.
          hoy="$(TZ=Europe/Madrid date +%d.%m.%Y)"
          r_de() { printf '%s' "$1" | sed -nE "s/^v\.${hoy//./\\.}\.r([0-9]+)\..*/\1/p"; }
          r_vivo="$(r_de "$(printf '%s' "$vivo" | jq -r '.version // empty')")"
          repo="$(sed -n 's/.*admiranext-version.*content="\(v\.[^"]*\)".*/\1/p' index.html | head -1)"
          r_repo="$(r_de "$repo")"
          if [ -n "$r_repo" ] && [ "$r_repo" -gt "${r_vivo:-0}" ]; then
            echo "· el merge trae su propio sello ($repo): se publica tal cual."
            export ADMIRA_RELEASE_AGENT="$(jq -r '.deployer // .agent' release-signature.json)"
            export ADMIRA_RELEASE_MACHINE="$(jq -r '.machine' release-signature.json)"
          else
            sello="v.${hoy}.r$(( ${r_vivo:-0} + 1 )).$(TZ=Europe/Madrid date +%H:%M)"
            # En un merge, el autor del PR es el del segundo padre; en un push directo, el del commit.
            if git rev-parse -q --verify 'HEAD^2' >/dev/null; then autor="$(git log -1 --format=%an 'HEAD^2')"; else autor="$(git log -1 --format=%an HEAD)"; fi
            autor="$(printf '%s' "$autor" | tr -cd '[:alnum:] ._-' | cut -c1-60)"
            # La novedad: el título del PR (cuerpo del commit de merge) o, si no hay, el asunto del commit.
            novedad="$(git log -1 --format=%b HEAD | sed '/^\s*$/d' | head -1)"
            [ -n "$novedad" ] || novedad="$(git log -1 --format=%s HEAD)"
            export ADMIRA_RELEASE_AGENT="${autor:-GitHubActions}" ADMIRA_RELEASE_MACHINE="GitHubActions"
            python3 tools/sellar-release.py "$sello" "$ADMIRA_RELEASE_AGENT" "$ADMIRA_RELEASE_MACHINE" "$novedad"
          fi
          ./deploy.sh cf

      - name: Comprobar producción
        run: |
          set -euo pipefail
          esperado="$(git rev-parse --short=7 HEAD)"
          for intento in 1 2 3 4 5 6; do
            vivo="$(curl -fsS "https://admira.tv/version.json?t=$(date +%s)" | jq -r '.gitShort // empty')"
            if [ "$vivo" = "$esperado" ]; then echo "✓ admira.tv sirve $esperado"; exit 0; fi
            sleep 10
          done
          git fetch --quiet origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then echo "· producción ya publica un commit posterior"; exit 0; fi
          echo "✗ admira.tv no sirve $esperado (sirve «$vivo»)"; exit 1
